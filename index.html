<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baba Gostosinho</title>
    <!-- Tailwind CSS 3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .star-rating button { transition: transform 0.1s; }
        .star-rating button:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configurações do JSONbin
        const BIN_ID = '69af06d2ae596e708f71a0ef';
        const MASTER_KEY = '$2a$10$RxtN.VwYLRsGcmoCji08oeL2di9W0D4tyrBZe/vIV77N665ALQ9Vi';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // Componente de Ícone Lucide (Wrapper para CDN)
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    lucide.createIcons({
                        attrs: {
                            size,
                            class: className,
                            fill
                        },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, className, fill]);
            return <i data-lucide={name} ref={iconRef} className={className}></i>;
        };

        function App() {
            const [players, setPlayers] = useState([]);
            const [finances, setFinances] = useState([]);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('futamigos_current_user'));
            const [currentTab, setCurrentTab] = useState('home');
            const [adminSubTab, setAdminSubTab] = useState('finance');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [isViewMode, setIsViewMode] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [isLoading, setIsLoading] = useState(true);
            
            // Form States
            const [newPlayerName, setNewPlayerName] = useState('');
            const [newPlayerRating, setNewPlayerRating] = useState(3);
            const [isGoalkeeper, setIsGoalkeeper] = useState(false);
            const [isPunished, setIsPunished] = useState(false);
            const [financeDesc, setFinanceDesc] = useState('');
            const [financeAmount, setFinanceAmount] = useState('');
            const [financeType, setFinanceType] = useState('income');

            // Match States
            const [teamA, setTeamA] = useState({ players: [], score: 0 });
            const [teamB, setTeamB] = useState({ players: [], score: 0 });
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const timerRef = useRef(null);

            // Carregar dados do JSONbin
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(API_URL, {
                            headers: { 'X-Master-Key': MASTER_KEY }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            setPlayers(data.record.players || []);
                            setFinances(data.record.finances || []);
                        }
                    } catch (error) {
                        console.error("Erro ao carregar dados:", error);
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchData();
            }, []);

            // Salvar dados no JSONbin
            const saveData = async (newPlayers, newFinances) => {
                try {
                    await fetch(API_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': MASTER_KEY
                        },
                        body: JSON.stringify({ players: newPlayers, finances: newFinances })
                    });
                } catch (error) {
                    console.error("Erro ao salvar dados:", error);
                }
            };

            // Timer Logic
            useEffect(() => {
                if (isTimerRunning) {
                    timerRef.current = setInterval(() => {
                        setTimerSeconds(s => s + 1);
                    }, 1000);
                } else {
                    if (timerRef.current) clearInterval(timerRef.current);
                }
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [isTimerRunning]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            };

            const handleAdminAuth = () => {
                const authorizedPasswords = ["Dan2620", "Davi2168"];
                if (authorizedPasswords.includes(passwordInput)) {
                    setCurrentUser(passwordInput);
                    localStorage.setItem('futamigos_current_user', passwordInput);
                    setIsAdminMode(true);
                    setIsViewMode(false);
                    setShowPasswordModal(false);
                    setCurrentTab('home');
                    setPasswordInput('');
                } else {
                    alert("Senha incorreta! Acesso negado.");
                }
            };

            const addPlayer = () => {
                if (!newPlayerName.trim()) return;
                const newPlayer = {
                    id: Date.now().toString(),
                    name: newPlayerName.trim(),
                    level: newPlayerRating,
                    author: currentUser,
                    isGoalkeeper: isGoalkeeper,
                    isPunished: isPunished
                };
                const updatedPlayers = [...players, newPlayer];
                setPlayers(updatedPlayers);
                saveData(updatedPlayers, finances);
                setNewPlayerName('');
                setNewPlayerRating(3);
                setIsGoalkeeper(false);
                setIsPunished(false);
            };

            const togglePlayerStatus = (id, field) => {
                const updatedPlayers = players.map(p => {
                    if (p.id === id) {
                        return { ...p, [field]: !p[field] };
                    }
                    return p;
                });
                setPlayers(updatedPlayers);
                saveData(updatedPlayers, finances);
            };

            const removePlayer = (id) => {
                const updatedPlayers = players.filter(p => p.id !== id);
                setPlayers(updatedPlayers);
                saveData(updatedPlayers, finances);
            };

            const generateWhatsAppList = (isEmpty = false) => {
                const today = new Date();
                const nextSaturday = new Date();
                nextSaturday.setDate(today.getDate() + (6 - today.getDay() + 7) % 7);
                const dateStr = nextSaturday.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                
                const activePlayers = isEmpty ? [] : players.filter(p => !p.isGoalkeeper && !p.isPunished);
                const goalkeepers = isEmpty ? [] : players.filter(p => p.isGoalkeeper && !p.isPunished);
                const punished = isEmpty ? [] : players.filter(p => p.isPunished);

                let listText = `*⚽💨💨🏃🏻LISTA DO BABA GOSTOSINHO*\n\n`;
                listText += ` *${dateStr} - Sábado* ⚽🏆\n`;
                listText += `*Horário - 15:30 horas da tarde*\n`;
                listText += ` *Valor: 8,00* \n`;
                listText += ` *Chave PIX : 7799930-4025*\n`;
                listText += `*Esmael de Souza Silva*\n`;
                listText += `⚠️ *OBRIGATÓRIO COLETES AZUL E VERMELHO ⚠️*\n\n`;

                for (let i = 1; i <= 24; i++) {
                    const p = activePlayers[i-1];
                    const num = i === 13 ? '🇧🇷' : i;
                    listText += `${num}- ${p ? p.name : ''}\n`;
                }

                listText += `\nSuplentes:\n`;
                for (let i = 1; i <= 4; i++) {
                    const p = activePlayers[i + 23];
                    listText += `${i}- ${p ? p.name : ''}\n`;
                }

                listText += `\n*Goleiros*\n\n`;
                for (let i = 1; i <= 4; i++) {
                    const p = goalkeepers[i-1];
                    listText += `${i}- ${p ? p.name : ''}\n`;
                }

                listText += `*LISTA DE PUNIDOS - R$ 15,00*\n`;
                for (let i = 1; i <= 3; i++) {
                    const p = punished[i-1];
                    listText += `${i}- ${p ? p.name : ''}\n`;
                }

                listText += `\n*OBS:* \n\n`;
                listText += `*OBS: LIMITE MÁXIMO DE 4 TIMES*\n`;
                listText += `*_⚠️🤑PAGAMENTO ANTES DE COMEÇAR, VAI SER FEITO A CHAMADA QUEM NÃO PAGOU ANTES NÃO JOGA🤑⚠️_*\n\n`;
                listText += `*🥵🍶🥛LEVEM SUAS GARRAFAS DE ÁGUA⚠️*\n\n`;
                listText += `segue o grupo:\n\n`;
                listText += `https://chat.whatsapp.com/HmhI6eAXcXy4cBAIZzEnl8?mode=hqctswi`;

                if (isEmpty) {
                    window.open(`https://wa.me/?text=${encodeURIComponent(listText)}`, '_blank');
                } else {
                    navigator.clipboard.writeText(listText);
                    alert('Lista copiada para o WhatsApp!');
                }
            };

            const sendTeamsToWhatsApp = () => {
                if (teamA.players.length === 0 && teamB.players.length === 0) {
                    alert('Nenhum sorteio realizado ainda!');
                    return;
                }

                let text = `⚽ *SORTEIO REALIZADO - BABA GOSTOSINHO* ⚽\n\n`;
                
                text += `🟢 *TIME A*\n`;
                teamA.players.forEach((p, i) => {
                    text += `${i + 1}. ${p.name}\n`;
                });
                
                text += `\n⚫ *TIME B*\n`;
                teamB.players.forEach((p, i) => {
                    text += `${i + 1}. ${p.name}\n`;
                });
                
                text += `\n🔥 *Bom jogo a todos!*`;

                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            };

            const addFinanceEntry = () => {
                const amount = parseFloat(financeAmount);
                if (!financeDesc.trim() || isNaN(amount)) return;
                const entry = {
                    id: Date.now().toString(),
                    description: financeDesc.trim(),
                    amount: amount,
                    type: financeType,
                    date: new Date().toLocaleDateString('pt-BR'),
                    author: currentUser
                };
                const updatedFinances = [...finances, entry];
                setFinances(updatedFinances);
                saveData(players, updatedFinances);
                setFinanceDesc('');
                setFinanceAmount('');
            };

            const removeFinanceEntry = (id) => {
                const updatedFinances = finances.filter(f => f.id !== id);
                setFinances(updatedFinances);
                saveData(players, updatedFinances);
            };

            const generateTeams = () => {
                if (players.length < 2) return;
                const sorted = [...players].filter(p => !p.isPunished).sort((a, b) => b.level - a.level);
                const a = [];
                const b = [];
                sorted.forEach((p, i) => {
                    if (i % 2 === 0) a.push(p);
                    else b.push(p);
                });
                const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
                setTeamA({ players: shuffle(a), score: 0 });
                setTeamB({ players: shuffle(b), score: 0 });
                setCurrentTab('teams');
            };

            const updateScore = (team, val) => {
                if (team === 'a') setTeamA({ ...teamA, score: Math.max(0, teamA.score + val) });
                else setTeamB({ ...teamB, score: Math.max(0, teamB.score + val) });
            };

            const shareMatch = () => {
                const text = `⚽ *Baba gostosinho - Resumo da Partida* ⚽\n\n` +
                    `Placar: Time A ${teamA.score} x ${teamB.score} Time B\n` +
                    `Tempo: ${formatTime(timerSeconds)}\n\n` +
                    `*Time A:* ${teamA.players.map(p => p.name).join(', ')}\n` +
                    `*Time B:* ${teamB.players.map(p => p.name).join(', ')}\n\n` +
                    `Organizado via Baba gostosinho!`;

                if (navigator.share) {
                    navigator.share({ text });
                } else {
                    navigator.clipboard.writeText(text);
                    alert('Resumo copiado para a área de transferência!');
                }
            };

            const totalBalance = finances.reduce((acc, f) => {
                return f.type === 'income' ? acc + f.amount : acc - f.amount;
            }, 0);

            const getAuthorTag = (author) => {
                if (author === 'Dan2620') return <span className="ml-2 px-1.5 py-0.5 bg-black text-white text-[8px] font-black rounded uppercase">Dan</span>;
                if (author === 'Davi2168') return <span className="ml-2 px-1.5 py-0.5 bg-red-600 text-white text-[8px] font-black rounded uppercase">Davi</span>;
                return null;
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-zinc-50">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div>
                    </div>
                );
            }

            return (
                <div className="bg-zinc-50 text-zinc-900 min-h-screen pb-24">
                    {/* Header */}
                    {(currentTab !== 'home' || isAdminMode) && (
                        <header className="bg-white border-b border-zinc-200 sticky top-0 z-10">
                            <div className="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                                <button 
                                    onClick={() => {
                                        if (isAdminMode && currentTab === 'home') setIsAdminMode(false);
                                        else setCurrentTab('home');
                                    }} 
                                    className="p-2 hover:bg-zinc-100 rounded-full transition-colors text-zinc-600"
                                >
                                    <Icon name="chevron-left" size={20} />
                                </button>
                                <button onClick={shareMatch} className="p-2 hover:bg-zinc-100 rounded-full transition-colors text-zinc-600">
                                    <Icon name="share-2" size={20} />
                                </button>
                            </div>
                        </header>
                    )}

                    <main className="max-w-md mx-auto px-4 py-6">
                        {/* Home Tab */}
                        {currentTab === 'home' && (
                            <div className="space-y-6">
                                {!isAdminMode && !isViewMode ? (
                                    <div className="fixed inset-0 flex flex-col items-center justify-end px-8 pb-20 bg-cover bg-center" style={{ backgroundImage: "url('https://image2url.com/r2/default/images/1773069462364-21238cdb-2ba8-4949-b313-b74d3a6466ec.png')" }}>
                                        <div className="flex gap-4 w-full max-w-md">
                                            <button 
                                                onClick={() => setShowPasswordModal(true)} 
                                                className="flex-1 bg-emerald-600/80 backdrop-blur-md hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-[0_6px_0_rgb(5,120,85)] transition-all active:shadow-none active:translate-y-[6px] flex flex-col items-center justify-center gap-2 border border-white/20"
                                            >
                                                <Icon name="shield-check" size={24} />
                                                <span className="text-xs tracking-widest">COMISSÃO</span>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsViewMode(true);
                                                    setCurrentTab('teams');
                                                }} 
                                                className="flex-1 bg-yellow-400/80 backdrop-blur-md hover:bg-yellow-400 text-yellow-950 font-bold py-4 rounded-2xl shadow-[0_6px_0_rgb(202,138,4)] transition-all active:shadow-none active:translate-y-[6px] flex flex-col items-center justify-center gap-2 border border-yellow-300/30"
                                            >
                                                <Icon name="users" size={24} />
                                                <span className="text-xs tracking-widest">JOGADOR</span>
                                            </button>
                                        </div>
                                    </div>
                                ) : isAdminMode ? (
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black tracking-tight text-zinc-900">Painel ADM</h2>
                                        <div className="flex bg-zinc-200/50 p-1 rounded-xl">
                                            {['finance', 'members', 'draw', 'list'].map((tab) => (
                                                <button 
                                                    key={tab}
                                                    onClick={() => setAdminSubTab(tab)} 
                                                    className={`flex-1 py-2 text-[10px] font-bold rounded-lg transition-all ${adminSubTab === tab ? 'bg-white shadow-sm text-emerald-600' : 'text-zinc-500'}`}
                                                >
                                                    {tab === 'finance' ? 'FINANCEIRO' : tab === 'members' ? 'MEMBROS' : tab === 'draw' ? 'SORTEIO' : 'LISTA'}
                                                </button>
                                            ))}
                                        </div>

                                        {adminSubTab === 'finance' && (
                                            <div className="space-y-6">
                                                <div className="bg-emerald-600 p-6 rounded-3xl text-white shadow-lg shadow-emerald-600/20">
                                                    <p className="text-xs font-bold uppercase tracking-widest opacity-80">Saldo Total</p>
                                                    <p className="text-4xl font-black">R$ {totalBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                                </div>
                                                <section className="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
                                                    <h3 className="text-sm font-semibold uppercase tracking-wider text-zinc-500 mb-4 flex items-center gap-2">
                                                        <Icon name="dollar-sign" size={16} />
                                                        Nova Transação
                                                    </h3>
                                                    <div className="space-y-3">
                                                        <input type="text" value={financeDesc} onChange={(e) => setFinanceDesc(e.target.value)} placeholder="Descrição" className="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
                                                        <div className="flex gap-2">
                                                            <input type="number" value={financeAmount} onChange={(e) => setFinanceAmount(e.target.value)} placeholder="Valor" className="flex-1 px-4 py-3 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
                                                            <select value={financeType} onChange={(e) => setFinanceType(e.target.value)} className="px-4 py-3 rounded-xl border border-zinc-200 bg-white">
                                                                <option value="income">Receita</option>
                                                                <option value="expense">Despesa</option>
                                                            </select>
                                                        </div>
                                                        <button onClick={addFinanceEntry} className="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl">Lançar</button>
                                                    </div>
                                                </section>
                                                <div className="space-y-2">
                                                    {finances.slice().reverse().map(f => (
                                                        <div key={f.id} className="bg-white p-4 rounded-xl border border-zinc-200 flex items-center justify-between">
                                                            <div>
                                                                <p className="font-bold text-zinc-800 flex items-center">{f.description}{getAuthorTag(f.author)}</p>
                                                                <p className="text-[10px] text-zinc-400 uppercase font-bold">{f.date}</p>
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                <span className={`font-black ${f.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                                                                    {f.type === 'income' ? '+' : '-'} R$ {f.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                                                </span>
                                                                <button onClick={() => removeFinanceEntry(f.id)} className="p-1 text-zinc-300 hover:text-red-500">
                                                                    <Icon name="trash-2" size={14} />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {adminSubTab === 'members' && (
                                            <div className="space-y-6">
                                                <section className="bg-white p-5 rounded-2xl shadow-sm border border-zinc-200">
                                                    <h3 className="text-sm font-semibold uppercase tracking-wider text-zinc-500 mb-4 flex items-center gap-2">
                                                        <Icon name="plus" size={16} />
                                                        Novo Membro
                                                    </h3>
                                                    <div className="space-y-4">
                                                        <input type="text" value={newPlayerName} onChange={(e) => setNewPlayerName(e.target.value)} placeholder="Nome" className="w-full px-4 py-3 rounded-xl border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-emerald-500/20" />
                                                        <div className="flex items-center justify-between bg-zinc-50 p-3 rounded-xl">
                                                            <span className="text-sm text-zinc-600 font-medium">Nível:</span>
                                                            <div className="flex gap-1">
                                                                {[1, 2, 3, 4, 5].map((star) => (
                                                                    <button key={star} onClick={() => setNewPlayerRating(star)} className={`p-1 ${newPlayerRating >= star ? 'text-amber-400' : 'text-zinc-300'}`}>
                                                                        <Icon name="star" size={20} fill={newPlayerRating >= star ? "currentColor" : "none"} />
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                        <div className="flex gap-2">
                                                            <button 
                                                                onClick={() => setIsGoalkeeper(!isGoalkeeper)} 
                                                                className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all ${isGoalkeeper ? 'bg-emerald-100 border-emerald-500 text-emerald-600' : 'bg-zinc-50 border-zinc-200 text-zinc-400'}`}
                                                            >
                                                                GOLEIRO
                                                            </button>
                                                            <button 
                                                                onClick={() => setIsPunished(!isPunished)} 
                                                                className={`flex-1 py-2 rounded-xl text-xs font-bold border transition-all ${isPunished ? 'bg-red-100 border-red-500 text-red-600' : 'bg-zinc-50 border-zinc-200 text-zinc-400'}`}
                                                            >
                                                                PUNIDO
                                                            </button>
                                                        </div>
                                                        <button onClick={addPlayer} className="w-full bg-emerald-600 text-white font-semibold py-3 rounded-xl">Confirmar</button>
                                                    </div>
                                                </section>
                                                <div className="space-y-2">
                                                    {players.map(p => (
                                                        <div key={p.id} className="bg-white p-4 rounded-xl border border-zinc-200 flex items-center justify-between">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-8 h-8 rounded-full bg-zinc-100 flex items-center justify-center text-xs font-bold text-zinc-500">
                                                                    {p.name.charAt(0).toUpperCase()}
                                                                </div>
                                                                <div>
                                                                    <p className="font-semibold text-zinc-800 flex items-center">
                                                                        {p.name}{getAuthorTag(p.author)}
                                                                        {p.isGoalkeeper && <span className="ml-2 text-[8px] bg-amber-100 text-amber-600 px-1 rounded">GK</span>}
                                                                        {p.isPunished && <span className="ml-2 text-[8px] bg-red-100 text-red-600 px-1 rounded">PUNIDO</span>}
                                                                    </p>
                                                                    <div className="flex gap-0.5">
                                                                        {Array.from({ length: p.level }).map((_, i) => (
                                                                            <Icon key={i} name="star" size={10} fill="currentColor" className="text-amber-400" />
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            <div className="flex gap-2">
                                                                <button onClick={() => togglePlayerStatus(p.id, 'isGoalkeeper')} className={`p-2 rounded-lg ${p.isGoalkeeper ? 'text-amber-500 bg-amber-50' : 'text-zinc-300'}`}>
                                                                    <Icon name="shield" size={18} />
                                                                </button>
                                                                <button onClick={() => removePlayer(p.id)} className="p-2 text-zinc-300 hover:text-red-500">
                                                                    <Icon name="trash-2" size={18} />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {adminSubTab === 'draw' && (
                                            <div className="bg-white p-8 rounded-3xl border border-zinc-200 text-center space-y-6">
                                                <div className="w-20 h-20 bg-zinc-100 rounded-full flex items-center justify-center mx-auto text-zinc-400">
                                                    <Icon name="shuffle" size={40} />
                                                </div>
                                                <h3 className="text-xl font-bold">Sorteio de Times</h3>
                                                <div className="bg-zinc-50 p-4 rounded-2xl border flex justify-between items-center">
                                                    <span className="text-sm font-bold text-zinc-600">Membros Ativos:</span>
                                                    <span className="text-xl font-black text-emerald-600">{players.filter(p => !p.isPunished).length}</span>
                                                </div>
                                                <button onClick={generateTeams} className="w-full bg-emerald-600 text-white font-black py-5 rounded-2xl shadow-lg">REALIZAR SORTEIO</button>
                                            </div>
                                        )}

                                        {adminSubTab === 'list' && (
                                            <div className="bg-white p-8 rounded-3xl border border-zinc-200 text-center space-y-6">
                                                <div className="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto text-emerald-600">
                                                    <Icon name="message-square" size={40} />
                                                </div>
                                                <h3 className="text-xl font-bold">Lista WhatsApp</h3>
                                                <p className="text-sm text-zinc-500">Gere o texto formatado para postar no grupo.</p>
                                                
                                                <div className="space-y-3">
                                                    <button onClick={sendTeamsToWhatsApp} className="w-full bg-emerald-600 text-white font-black py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                                                        <Icon name="shuffle" size={20} /> ENVIAR SORTEIO PRONTO
                                                    </button>
                                                    
                                                    <button onClick={() => generateWhatsAppList(true)} className="w-full bg-zinc-800 text-white font-black py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                                                        <Icon name="send" size={20} /> ENVIAR LISTA VAZIA
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ) : null}
                            </div>
                        )}

                        {/* Teams Tab */}
                        {currentTab === 'teams' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl font-black">Times Sorteados</h2>
                                    {isAdminMode && (
                                        <button onClick={generateTeams} className="text-sm font-medium text-emerald-600 flex items-center gap-1">
                                            <Icon name="shuffle" size={16} /> Sortear Novamente
                                        </button>
                                    )}
                                </div>
                                <div className="grid grid-cols-1 gap-4">
                                    {[ {t: teamA, n: 'A', c: 'bg-emerald-600'}, {t: teamB, n: 'B', c: 'bg-zinc-800'} ].map(team => (
                                        <div key={team.n} className="bg-white rounded-2xl border border-zinc-200 overflow-hidden shadow-sm">
                                            <div className={`${team.c} px-4 py-3 text-white flex justify-between items-center`}>
                                                <h3 className="font-bold">Time {team.n}</h3>
                                                <span className="text-xs bg-white/20 px-2 py-0.5 rounded-full">
                                                    Média: {(team.t.players.reduce((acc, p) => acc + p.level, 0) / (team.t.players.length || 1)).toFixed(1)}
                                                </span>
                                            </div>
                                            <div className="p-4 space-y-2">
                                                {team.t.players.map(p => (
                                                    <div key={p.id} className="flex items-center justify-between py-1 border-b border-zinc-50 last:border-0">
                                                        <span className="text-sm font-medium text-zinc-700">{p.name}</span>
                                                        <div className="flex gap-0.5">
                                                            {Array.from({ length: p.level }).map((_, i) => (
                                                                <Icon key={i} name="star" size={8} fill="currentColor" className="text-amber-400" />
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                {isAdminMode && (
                                    <button onClick={() => setCurrentTab('match')} className="w-full bg-zinc-900 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                                        Começar Partida <Icon name="play" size={20} />
                                    </button>
                                )}
                            </div>
                        )}

                        {/* Match Tab */}
                        {currentTab === 'match' && (
                            <div className="space-y-8">
                                <div className="text-center space-y-2">
                                    <div className="inline-flex items-center gap-2 bg-zinc-100 px-4 py-2 rounded-full text-zinc-600 font-mono text-xl font-bold">
                                        <Icon name="play" size={20} /> <span>{formatTime(timerSeconds)}</span>
                                    </div>
                                    {isAdminMode && (
                                        <div className="flex justify-center gap-4 mt-4">
                                            <button onClick={() => setIsTimerRunning(!isTimerRunning)} className={`w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg ${isTimerRunning ? 'bg-amber-500' : 'bg-emerald-600'}`}>
                                                {isTimerRunning ? <Icon name="pause" size={24} /> : <Icon name="play" size={24} />}
                                            </button>
                                            <button onClick={() => { setIsTimerRunning(false); setTimerSeconds(0); }} className="w-14 h-14 rounded-full bg-zinc-200 text-zinc-600 flex items-center justify-center">
                                                <Icon name="rotate-ccw" size={24} />
                                            </button>
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-center justify-between gap-4">
                                    {[ {t: 'a', s: teamA.score, n: 'Time A', c: 'text-emerald-600'}, {t: 'b', s: teamB.score, n: 'Time B', c: 'text-zinc-800'} ].map(team => (
                                        <div key={team.t} className="flex-1 bg-white p-6 rounded-3xl border text-center space-y-4">
                                            <p className={`text-xs font-bold uppercase tracking-widest ${team.c}`}>{team.n}</p>
                                            <p className="text-6xl font-black">{team.s}</p>
                                            {isAdminMode && (
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => updateScore(team.t, -1)} className="p-2 bg-zinc-100 rounded-xl"><Icon name="minus" size={20} /></button>
                                                    <button onClick={() => updateScore(team.t, 1)} className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><Icon name="plus" size={20} /></button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <button onClick={() => setCurrentTab('teams')} className="w-full py-3 text-sm font-semibold text-zinc-400">Encerrar Partida</button>
                            </div>
                        )}

                        {/* Finance Tab (Player View) */}
                        {currentTab === 'finance' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black">Financeiro</h2>
                                <div className="bg-emerald-600 p-6 rounded-3xl text-white shadow-lg">
                                    <p className="text-xs font-bold uppercase opacity-80">Saldo em Caixa</p>
                                    <p className="text-4xl font-black">R$ {totalBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                </div>
                                <div className="space-y-2">
                                    {finances.slice().reverse().map(f => (
                                        <div key={f.id} className="bg-white p-4 rounded-xl border flex items-center justify-between">
                                            <div>
                                                <p className="font-bold text-zinc-800 flex items-center">{f.description}{getAuthorTag(f.author)}</p>
                                                <p className="text-[10px] text-zinc-400 uppercase font-bold">{f.date}</p>
                                            </div>
                                            <span className={`font-black ${f.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                                                {f.type === 'income' ? '+' : '-'} R$ {f.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    {(currentTab !== 'home' || isAdminMode) && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 px-4 py-3 z-10">
                            <div className="max-w-md mx-auto flex justify-around items-center">
                                <button onClick={() => { if (isViewMode) setCurrentTab('finance'); else if (isAdminMode) { setCurrentTab('home'); setAdminSubTab('finance'); } }} className={`flex flex-col items-center gap-1 ${((isAdminMode && currentTab === 'home' && adminSubTab === 'finance') || (isViewMode && currentTab === 'finance')) ? 'text-emerald-600' : 'text-zinc-400'}`}>
                                    <Icon name={isViewMode ? 'dollar-sign' : 'shield-check'} size={24} />
                                    <span className="text-[10px] font-bold uppercase">{isViewMode ? 'Financeiro' : 'Comissão'}</span>
                                </button>
                                <button onClick={() => setCurrentTab('teams')} className={`flex flex-col items-center gap-1 ${currentTab === 'teams' ? 'text-emerald-600' : 'text-zinc-400'}`}>
                                    <Icon name="shuffle" size={24} />
                                    <span className="text-[10px] font-bold uppercase">Times</span>
                                </button>
                                <button onClick={() => setCurrentTab('match')} className={`flex flex-col items-center gap-1 ${currentTab === 'match' ? 'text-emerald-600' : 'text-zinc-400'}`}>
                                    <Icon name="trophy" size={24} />
                                    <span className="text-[10px] font-bold uppercase">Partida</span>
                                </button>
                            </div>
                        </nav>
                    )}

                    {/* Password Modal */}
                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-xs rounded-3xl p-8 shadow-2xl space-y-6">
                                <div className="text-center space-y-2">
                                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                                        <Icon name="lock" size={32} />
                                    </div>
                                    <h3 className="text-xl font-black">Acesso Restrito</h3>
                                    <p className="text-sm text-zinc-500">Digite a senha da Comissão</p>
                                </div>
                                <div className="space-y-4">
                                    <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdminAuth()} placeholder="••••••••" className="w-full px-4 py-4 rounded-2xl border-2 text-center text-2xl tracking-widest font-mono" />
                                    <div className="flex gap-3">
                                        <button onClick={() => setShowPasswordModal(false)} className="flex-1 py-4 font-bold text-zinc-400">Cancelar</button>
                                        <button onClick={handleAdminAuth} className="flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">Entrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

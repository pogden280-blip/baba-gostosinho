<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baba Gostosinho</title>
    <!-- Tailwind CSS 3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .star-rating button { transition: transform 0.1s; }
        .star-rating button:active { transform: scale(0.9); }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f4f4f5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Verificação de dependências
        if (!window.lucide || !window.React || !window.ReactDOM) {
            console.error("Erro: Algumas dependências (Lucide, React ou ReactDOM) não foram carregadas corretamente.");
        }

        // Configurações do JSONbin
        const BIN_ID = '69af06d2ae596e708f71a0ef';
        const MASTER_KEY = '$2a$10$RxtN.VwYLRsGcmoCji08oeL2di9W0D4tyrBZe/vIV77N665ALQ9Vi';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // Componente de Ícone Lucide (Wrapper para CDN)
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (containerRef.current) {
                    // Clear container and create a fresh i element for Lucide to replace
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    
                    if (window.lucide) {
                        window.lucide.createIcons({
                            attrs: {
                                size,
                                class: className,
                                fill
                            },
                            nameAttr: 'data-lucide'
                        });
                    }
                }
            }, [name, size, className, fill]);

            return <span ref={containerRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        function App() {
            const [players, setPlayers] = useState([]);
            const [finances, setFinances] = useState([]);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('futamigos_current_user'));
            const [currentTab, setCurrentTab] = useState('home');
            const [adminSubTab, setAdminSubTab] = useState('finance');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [isViewMode, setIsViewMode] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [isLoading, setIsLoading] = useState(true);
            
            const [showAddPlayerForm, setShowAddPlayerForm] = useState(false);
            const [showAddGuestForm, setShowAddGuestForm] = useState(false);
            const [guests, setGuests] = useState([]);
            const [confirmedPlayerIds, setConfirmedPlayerIds] = useState([]);
            const [newGuestName, setNewGuestName] = useState('');
            const [newGuestRating, setNewGuestRating] = useState(3);
            const [isGuestGoalkeeper, setIsGuestGoalkeeper] = useState(false);
            const [isGuestPaid, setIsGuestPaid] = useState(true);
            
            // Form States
            const [newPlayerName, setNewPlayerName] = useState('');
            const [newPlayerRating, setNewPlayerRating] = useState(3);
            const [newPlayerType, setNewPlayerType] = useState('diarista');
            const [newPlayerPaymentStatus, setNewPlayerPaymentStatus] = useState('pago');
            const [newPlayerDueDate, setNewPlayerDueDate] = useState('');
            const [isGoalkeeper, setIsGoalkeeper] = useState(false);
            const [isPunished, setIsPunished] = useState(false);
            const [financeDesc, setFinanceDesc] = useState('');
            const [financeAmount, setFinanceAmount] = useState('');
            const [financeType, setFinanceType] = useState('income');
            const [mensalidadeValue, setMensalidadeValue] = useState(30);
            const [diariaValue, setDiariaValue] = useState(8);
            const [isSavingSettings, setIsSavingSettings] = useState(false);
            const [filterStartDate, setFilterStartDate] = useState('');
            const [filterEndDate, setFilterEndDate] = useState('');

            // Match States
            const [teams, setTeams] = useState([]); // Array of { name: 'Time 1', players: [], score: 0 }
            const [currentMatchTeams, setCurrentMatchTeams] = useState([0, 1]); // Indices of teams in match
            const [matchHistory, setMatchHistory] = useState([]); // Array of { t1: name, s1: score, t2: name, s2: score, time: string }
            const [showDaySummary, setShowDaySummary] = useState(false);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const timerRef = useRef(null);

            // Carregar dados do JSONbin
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(API_URL, {
                            headers: { 'X-Master-Key': MASTER_KEY }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            const rawPlayers = data.record.players || [];
                            const rawFinances = data.record.finances || [];
                            const rawHistory = data.record.matchHistory || [];
                            const rawGuests = data.record.guests || [];
                            const rawConfirmed = data.record.confirmedPlayerIds || [];
                            const rawMensalidade = data.record.mensalidadeValue || 30;
                            const rawDiaria = data.record.diariaValue || 8;
                            
                            // Check for expirations
                            const today = new Date();
                            today.setHours(0, 0, 0, 0);
                            let expirationsChanged = false;
                            const processedPlayers = rawPlayers.map(p => {
                                if (p.type === 'mensalista' && p.paymentStatus === 'pago' && p.dueDate) {
                                    const [year, month, day] = p.dueDate.split('-').map(Number);
                                    const dueDate = new Date(year, month - 1, day);
                                    if (dueDate < today) {
                                        expirationsChanged = true;
                                        return { ...p, paymentStatus: 'não' };
                                    }
                                }
                                return p;
                            });

                            setPlayers(processedPlayers);
                            setFinances(rawFinances);
                            setMatchHistory(rawHistory);
                            setGuests(rawGuests);
                            setMensalidadeValue(rawMensalidade);
                            setDiariaValue(rawDiaria);
                            
                            // Always filter confirmed list to only include paid players
                            let finalConfirmed = rawConfirmed.filter(id => {
                                const player = processedPlayers.find(p => p.id === id);
                                return player && player.paymentStatus === 'pago';
                            });

                            if (finalConfirmed.length === 0 && processedPlayers.length > 0 && !data.record.lastDraw) {
                                const mensalistas = processedPlayers.filter(p => p.type === 'mensalista' && !p.isPunished && p.paymentStatus === 'pago').map(p => p.id);
                                setConfirmedPlayerIds(mensalistas);
                            } else {
                                setConfirmedPlayerIds(finalConfirmed);
                            }

                            setShowDaySummary(data.record.showDaySummary || false);

                            if (expirationsChanged) {
                                saveData(processedPlayers, rawFinances, data.record.lastDraw, rawHistory, data.record.showDaySummary, rawGuests, finalConfirmed, rawMensalidade, rawDiaria);
                            }
                            if (data.record.lastDraw) {
                                if (data.record.lastDraw.teams) {
                                    setTeams(data.record.lastDraw.teams);
                                    if (data.record.lastDraw.currentMatchTeams) {
                                        setCurrentMatchTeams(data.record.lastDraw.currentMatchTeams);
                                    }
                                } else if (data.record.lastDraw.teamA) {
                                    setTeams([
                                        { ...data.record.lastDraw.teamA, name: 'Time 1' },
                                        { ...data.record.lastDraw.teamB, name: 'Time 2' }
                                    ]);
                                }
                            }
                        }
                    } catch (error) {
                        console.error("Erro ao carregar dados:", error);
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchData();
            }, []);

            // Salvar dados no JSONbin
            const saveData = async (newPlayers, newFinances, lastDraw, newHistory, newShowSummary, newGuests, newConfirmedIds, newMensalidade, newDiaria) => {
                try {
                    const currentDraw = lastDraw !== undefined ? lastDraw : (teams.length > 0 ? { teams, currentMatchTeams } : null);
                    const historyToSave = newHistory !== undefined ? newHistory : matchHistory;
                    const summaryToSave = newShowSummary !== undefined ? newShowSummary : showDaySummary;
                    const guestsToSave = newGuests !== undefined ? newGuests : guests;
                    const confirmedToSave = newConfirmedIds !== undefined ? newConfirmedIds : confirmedPlayerIds;
                    const mensalidadeToSave = newMensalidade !== undefined ? newMensalidade : mensalidadeValue;
                    const diariaToSave = newDiaria !== undefined ? newDiaria : diariaValue;
                    
                    const response = await fetch(API_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': MASTER_KEY
                        },
                        body: JSON.stringify({ 
                            players: newPlayers, 
                            finances: newFinances,
                            lastDraw: currentDraw,
                            matchHistory: historyToSave,
                            showDaySummary: summaryToSave,
                            guests: guestsToSave,
                            confirmedPlayerIds: confirmedToSave,
                            mensalidadeValue: mensalidadeToSave,
                            diariaValue: diariaToSave
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
                    }
                } catch (error) {
                    console.error("Erro ao salvar dados:", error);
                    alert("Erro ao salvar dados: " + error.message);
                }
            };

            // Timer Logic
            useEffect(() => {
                if (isTimerRunning) {
                    timerRef.current = setInterval(() => {
                        setTimerSeconds(s => s + 1);
                    }, 1000);
                } else {
                    if (timerRef.current) clearInterval(timerRef.current);
                }
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [isTimerRunning]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            };

            const handleAdminAuth = () => {
                const authorizedPasswords = ["Dan2620", "Davi2168"];
                if (authorizedPasswords.includes(passwordInput)) {
                    setCurrentUser(passwordInput);
                    localStorage.setItem('futamigos_current_user', passwordInput);
                    setIsAdminMode(true);
                    setIsViewMode(false);
                    setShowPasswordModal(false);
                    setCurrentTab('home');
                    setPasswordInput('');
                } else {
                    alert("Senha incorreta! Acesso negado.");
                }
            };

            const addPlayer = () => {
                if (!newPlayerName.trim()) return;
                const newPlayer = {
                    id: Date.now().toString(),
                    name: newPlayerName.trim(),
                    level: newPlayerRating,
                    type: newPlayerType,
                    paymentStatus: newPlayerPaymentStatus,
                    dueDate: newPlayerDueDate,
                    author: currentUser,
                    isGoalkeeper: isGoalkeeper,
                    isPunished: isPunished,
                    presences: 0,
                    totalBabas: 0
                };
                const updatedPlayers = [...players, newPlayer];
                setPlayers(updatedPlayers);
                
                let newConfirmed = [...confirmedPlayerIds];
                let newFinances = [...finances];

                if (newPlayer.paymentStatus === 'pago') {
                    newConfirmed.push(newPlayer.id);
                    setConfirmedPlayerIds(newConfirmed);

                    // Se for mensalista pago ao adicionar, lança no financeiro
                    if (newPlayer.type === 'mensalista') {
                        newFinances.push({
                            id: `m-${Date.now()}-${newPlayer.id}`,
                            description: `Mensalidade (Novo): ${newPlayer.name}`,
                            amount: mensalidadeValue,
                            type: 'income',
                            date: new Date().toLocaleDateString('pt-BR'),
                            author: currentUser
                        });
                        setFinances(newFinances);
                    }
                }

                saveData(updatedPlayers, newFinances, undefined, matchHistory, undefined, undefined, newConfirmed);
                setNewPlayerName('');
                setNewPlayerRating(3);
                setNewPlayerType('diarista');
                setNewPlayerPaymentStatus('pago');
                setNewPlayerDueDate('');
                setIsGoalkeeper(false);
                setIsPunished(false);
                setShowAddPlayerForm(false);
            };

            const updatePlayer = (id, field, value) => {
                let newConfirmedIds = [...confirmedPlayerIds];
                let newFinances = [...finances];
                const updatedPlayers = players.map(p => {
                    if (p.id === id) {
                        let updated = { ...p, [field]: value };
                        
                        // Lógica de confirmação automática baseada no pagamento
                        if (field === 'paymentStatus') {
                            if (value === 'pago') {
                                // Lógica para Mensalista: Adicionar receita ao pagar mensalidade
                                if (p.type === 'mensalista') {
                                    const today = new Date();
                                    today.setHours(0, 0, 0, 0);
                                    const [year, month, day] = (p.dueDate || '').split('-').map(Number);
                                    const currentDueDate = p.dueDate ? new Date(year, month - 1, day) : null;
                                    
                                    if (!currentDueDate || currentDueDate < today) {
                                        const nextMonth = new Date();
                                        nextMonth.setDate(nextMonth.getDate() + 30);
                                        updated.dueDate = nextMonth.toISOString().split('T')[0];
                                    }

                                    // Adicionar entrada financeira para mensalista
                                    newFinances.push({
                                        id: `m-${Date.now()}-${id}`,
                                        description: `Mensalidade: ${p.name}`,
                                        amount: mensalidadeValue,
                                        type: 'income',
                                        date: new Date().toLocaleDateString('pt-BR'),
                                        author: currentUser
                                    });
                                }
                                
                                if (!newConfirmedIds.includes(id)) {
                                    newConfirmedIds.push(id);
                                }
                            } else {
                                newConfirmedIds = newConfirmedIds.filter(cid => cid !== id);
                            }
                        }
                        return updated;
                    }
                    return p;
                });
                setPlayers(updatedPlayers);
                setConfirmedPlayerIds(newConfirmedIds);
                setFinances(newFinances);
                saveData(updatedPlayers, newFinances, undefined, matchHistory, undefined, undefined, newConfirmedIds);
            };

            const togglePlayerStatus = (id, field) => {
                const updatedPlayers = players.map(p => {
                    if (p.id === id) {
                        return { ...p, [field]: !p[field] };
                    }
                    return p;
                });
                setPlayers(updatedPlayers);
                saveData(updatedPlayers, finances, undefined, matchHistory);
            };

            const removePlayer = (id) => {
                const updatedPlayers = players.filter(p => p.id !== id);
                setPlayers(updatedPlayers);
                saveData(updatedPlayers, finances, undefined, matchHistory);
            };

            const generateWhatsAppList = (isEmpty = false) => {
                const today = new Date();
                const nextSaturday = new Date();
                // Calcula dias até o próximo sábado. Se hoje for sábado, pega o próximo (daqui a 7 dias)
                let daysUntilSaturday = (6 - today.getDay() + 7) % 7;
                if (daysUntilSaturday === 0) daysUntilSaturday = 7; 
                
                nextSaturday.setDate(today.getDate() + daysUntilSaturday);
                const dateStr = nextSaturday.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
                
                const activePlayers = isEmpty ? [] : players.filter(p => !p.isGoalkeeper && !p.isPunished);
                const goalkeepers = isEmpty ? [] : players.filter(p => p.isGoalkeeper && !p.isPunished);
                const punished = isEmpty ? [] : players.filter(p => p.isPunished);

                let listText = `*⚽💨💨🏃🏻LISTA DO BABA GOSTOSINHO*\n\n`;
                listText += ` *${dateStr} - Sábado* ⚽🏆\n`;
                listText += `*Horário - 15:30 horas da tarde*\n`;
                listText += ` *Valor: ${diariaValue.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}* \n`;
                listText += ` *Chave PIX : 7799930-4025*\n`;
                listText += `*Esmael de Souza Silva*\n`;
                listText += `⚠️ *OBRIGATÓRIO COLETES AZUL E VERMELHO ⚠️*\n\n`;

                for (let i = 1; i <= 24; i++) {
                    const p = activePlayers[i-1];
                    const num = i === 13 ? '🇧🇷' : i;
                    listText += `${num}- ${p ? p.name : ''}\n`;
                }

                listText += `\nSuplentes:\n`;
                for (let i = 1; i <= 4; i++) {
                    const p = activePlayers[i + 23];
                    listText += `${i}- ${p ? p.name : ''}\n`;
                }

                listText += `\n*Goleiros*\n\n`;
                for (let i = 1; i <= 4; i++) {
                    const p = goalkeepers[i-1];
                    listText += `${i}- ${p ? p.name : ''}\n`;
                }

                listText += `*LISTA DE PUNIDOS - R$ 15,00*\n`;
                for (let i = 1; i <= 3; i++) {
                    const p = punished[i-1];
                    listText += `${i}- ${p ? p.name : ''}\n`;
                }

                listText += `\n*OBS:* \n\n`;
                listText += `*OBS: LIMITE MÁXIMO DE 4 TIMES*\n`;
                listText += `*_⚠️🤑PAGAMENTO ANTES DE COMEÇAR, VAI SER FEITO A CHAMADA QUEM NÃO PAGOU ANTES NÃO JOGA🤑⚠️_*\n\n`;
                listText += `*🥵🍶🥛LEVEM SUAS GARRAFAS DE ÁGUA⚠️*\n\n`;
                listText += `segue o grupo:\n\n`;
                listText += `https://chat.whatsapp.com/HmhI6eAXcXy4cBAIZzEnl8?mode=hqctswi`;

                if (isEmpty) {
                    window.open(`https://wa.me/?text=${encodeURIComponent(listText)}`, '_blank');
                } else {
                    navigator.clipboard.writeText(listText);
                    alert('Lista copiada para o WhatsApp!');
                }
            };

            const sendTeamsToWhatsApp = () => {
                if (teams.length === 0) {
                    alert('Nenhum sorteio realizado ainda!');
                    return;
                }

                let text = `⚽ *SORTEIO REALIZADO - BABA GOSTOSINHO* ⚽\n\n`;
                
                teams.forEach((team, idx) => {
                    text += `${idx === 0 ? '🟢' : idx === 1 ? '⚫' : idx === 2 ? '🔵' : '🔴'} *${team.name}*\n`;
                    team.players.forEach((p, i) => {
                        text += `${i + 1}. ${p.name}\n`;
                    });
                    text += `\n`;
                });
                
                text += `🔥 *Bom jogo a todos!*`;

                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            };

            const addFinanceEntry = () => {
                const amount = parseFloat(financeAmount);
                if (!financeDesc.trim() || isNaN(amount)) return;
                const entry = {
                    id: Date.now().toString(),
                    description: financeDesc.trim(),
                    amount: amount,
                    type: financeType,
                    date: new Date().toLocaleDateString('pt-BR'),
                    author: currentUser
                };
                const updatedFinances = [...finances, entry];
                setFinances(updatedFinances);
                saveData(players, updatedFinances, undefined, matchHistory);
                setFinanceDesc('');
                setFinanceAmount('');
            };

            const removeFinanceEntry = (id) => {
                const updatedFinances = finances.filter(f => f.id !== id);
                setFinances(updatedFinances);
                saveData(players, updatedFinances, undefined, matchHistory);
            };

            const sendFinanceSummaryToWhatsApp = () => {
                const start = filterStartDate ? new Date(filterStartDate + 'T00:00:00') : null;
                const end = filterEndDate ? new Date(filterEndDate + 'T23:59:59') : null;
                
                const filtered = finances.filter(f => {
                    const [day, month, year] = f.date.split('/').map(Number);
                    const fDate = new Date(year, month - 1, day);
                    
                    if (start && fDate < start) return false;
                    if (end && fDate > end) return false;
                    return true;
                });

                if (filtered.length === 0) {
                    alert('Nenhuma movimentação encontrada no período selecionado!');
                    return;
                }

                let totalIncome = 0;
                let totalExpense = 0;
                
                let text = `📊 *LEVANTAMENTO FINANCEIRO - BABA GOSTOSINHO* 📊\n`;
                if (filterStartDate && filterEndDate) {
                    text += `📅 Período: ${new Date(filterStartDate + 'T00:00:00').toLocaleDateString('pt-BR')} até ${new Date(filterEndDate + 'T00:00:00').toLocaleDateString('pt-BR')}\n`;
                }
                text += `\n`;

                filtered.forEach(f => {
                    const sign = f.type === 'income' ? '🟢' : '🔴';
                    text += `${sign} ${f.date} - ${f.description}: R$ ${f.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}\n`;
                    if (f.type === 'income') totalIncome += f.amount;
                    else totalExpense += f.amount;
                });

                const balance = totalIncome - totalExpense;
                text += `\n--------------------------\n`;
                text += `✅ *Total Receitas:* R$ ${totalIncome.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}\n`;
                text += `❌ *Total Despesas:* R$ ${totalExpense.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}\n`;
                text += `💰 *SALDO FINAL:* R$ ${balance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}\n`;

                window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            };

            const generateTeams = () => {
                const confirmedPlayers = players.filter(p => confirmedPlayerIds.includes(p.id) && !p.isPunished);
                const activePlayersPool = [...confirmedPlayers, ...guests];
                if (activePlayersPool.length < 2) {
                    alert('Selecione pelo menos 2 jogadores para o sorteio!');
                    return;
                }
                const sorted = activePlayersPool.sort((a, b) => b.level - a.level);
                
                let numTeams = 2;
                if (sorted.length > 18) numTeams = 4;
                else if (sorted.length > 12) numTeams = 3;

                const newTeams = Array.from({ length: numTeams }, (_, i) => ({
                    id: i + 1,
                    name: `Time ${i + 1}`,
                    players: [],
                    score: 0
                }));
                
                sorted.forEach((p, i) => {
                    let teamIndex;
                    const round = Math.floor(i / numTeams);
                    if (round % 2 === 0) {
                        teamIndex = i % numTeams;
                    } else {
                        teamIndex = (numTeams - 1) - (i % numTeams);
                    }
                    newTeams[teamIndex].players.push(p);
                });

                newTeams.forEach(t => {
                    t.players = t.players.sort(() => Math.random() - 0.5);
                });

                setTeams(newTeams);
                setCurrentMatchTeams([0, 1]);
                setMatchHistory([]);
                setShowDaySummary(false);
                saveData(players, finances, { teams: newTeams, currentMatchTeams: [0, 1] }, [], false);
                setCurrentTab('teams');
            };

            const deleteDraw = () => {
                setTeams([]);
                setMatchHistory([]);
                setShowDaySummary(false);
                saveData(players, finances, null, [], false);
            };

            const updateScore = (teamIdx, val) => {
                const updatedTeams = [...teams];
                updatedTeams[teamIdx].score = Math.max(0, updatedTeams[teamIdx].score + val);
                setTeams(updatedTeams);
                saveData(players, finances, { teams: updatedTeams, currentMatchTeams }, matchHistory);
            };

            const endMatch = () => {
                const t1 = teams[currentMatchTeams[0]];
                const t2 = teams[currentMatchTeams[1]];
                if (!t1 || !t2) return;

                const newMatch = {
                    t1: t1.name,
                    s1: t1.score,
                    t2: t2.name,
                    s2: t2.score,
                    time: formatTime(timerSeconds),
                    timestamp: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                };

                const updatedHistory = [...matchHistory, newMatch];
                setMatchHistory(updatedHistory);
                
                // Reset scores for next match
                const updatedTeams = teams.map(t => ({ ...t, score: 0 }));
                setTeams(updatedTeams);
                setTimerSeconds(0);
                setIsTimerRunning(false);

                saveData(players, finances, { teams: updatedTeams, currentMatchTeams }, updatedHistory);
            };

            const endDay = () => {
                if (matchHistory.length === 0) {
                    alert('Nenhuma partida registrada hoje!');
                    return;
                }
                
                // Lançar receitas dos diaristas pagos e convidados
                const newFinances = [...finances];
                const paidDiaristas = players.filter(p => p.type === 'diarista' && p.paymentStatus === 'pago');
                
                // Diaristas
                paidDiaristas.forEach((p, index) => {
                    newFinances.push({
                        id: `d-${Date.now()}-${p.id}-${index}`,
                        description: `Diária: ${p.name}`,
                        amount: diariaValue,
                        type: 'income',
                        date: new Date().toLocaleDateString('pt-BR'),
                        author: currentUser
                    });
                });

                // Convidados (sempre pagam diária)
                guests.forEach((g, index) => {
                    newFinances.push({
                        id: `g-${Date.now()}-${g.id}-${index}`,
                        description: `Diária (Conv.): ${g.name}`,
                        amount: diariaValue,
                        type: 'income',
                        date: new Date().toLocaleDateString('pt-BR'),
                        author: currentUser
                    });
                });

                // Reset diaristas payment status and update frequency
                const updatedPlayers = players.map(p => {
                    const isConfirmed = confirmedPlayerIds.includes(p.id);
                    let updated = { 
                        ...p, 
                        totalBabas: (p.totalBabas || 0) + 1,
                        presences: (p.presences || 0) + (isConfirmed ? 1 : 0)
                    };
                    
                    if (p.type === 'diarista') {
                        updated.paymentStatus = 'devendo';
                    }
                    return updated;
                });
                
                setPlayers(updatedPlayers);
                setConfirmedPlayerIds([]); // Limpa confirmados ao encerrar o dia
                setFinances(newFinances);
                setGuests([]); // Limpa convidados ao encerrar o dia

                setShowDaySummary(true);
                saveData(updatedPlayers, newFinances, undefined, undefined, true, [], []);
            };

            const resetDay = () => {
                setMatchHistory([]);
                setTeams([]);
                setGuests([]);
                setShowDaySummary(false);
                
                const updatedPlayers = players.map(p => {
                    if (p.type === 'diarista') {
                        return { ...p, paymentStatus: 'devendo' };
                    }
                    return p;
                });
                setPlayers(updatedPlayers);

                const mensalistas = updatedPlayers.filter(p => p.type === 'mensalista' && !p.isPunished && p.paymentStatus === 'pago').map(p => p.id);
                setConfirmedPlayerIds(mensalistas);
                saveData(updatedPlayers, finances, null, [], false, [], mensalistas);
                setCurrentTab('home');
            };

            const shareDaySummary = () => {
                const stats = calculateStats();
                const sortedStats = Object.entries(stats).sort((a, b) => {
                    if (b[1].v !== a[1].v) return b[1].v - a[1].v;
                    return b[1].gp - a[1].gp;
                });

                let winnerText = "";
                if (sortedStats.length > 0) {
                    const topV = sortedStats[0][1].v;
                    const winners = sortedStats.filter(s => s[1].v === topV);
                    if (winners.length > 1) winnerText = `🏆 *Empate técnico:* ${winners.map(w => w[0]).join(' e ')}`;
                    else winnerText = `🏆 *Campeão:* ${winners[0][0]}`;
                }

                let text = `⚽ *RESUMO DO BABA GOSTOSINHO* ⚽\n\n${winnerText}\n\n`;
                
                text += `📊 *CLASSIFICAÇÃO:*\n`;
                sortedStats.forEach(([name, s]) => {
                    text += `${name}: ${s.v}V | ${s.e}E | ${s.d}D | ${s.gp} Gols\n`;
                });

                text += `\n👥 *ELENCOS:*\n`;
                teams.forEach(t => {
                    text += `*${t.name}:* ${t.players.map(p => p.name).join(', ')}\n`;
                });

                text += `\n🔥 *Parabéns a todos!*`;

                if (navigator.share) {
                    navigator.share({ text });
                } else {
                    const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
                    window.open(url, '_blank');
                }
            };

            const calculateStats = () => {
                const stats = {};
                teams.forEach(t => {
                    stats[t.name] = { v: 0, e: 0, d: 0, gp: 0 };
                });

                matchHistory.forEach(m => {
                    if (!stats[m.t1]) stats[m.t1] = { v: 0, e: 0, d: 0, gp: 0 };
                    if (!stats[m.t2]) stats[m.t2] = { v: 0, e: 0, d: 0, gp: 0 };

                    stats[m.t1].gp += m.s1;
                    stats[m.t2].gp += m.s2;

                    if (m.s1 > m.s2) {
                        stats[m.t1].v += 1;
                        stats[m.t2].d += 1;
                    } else if (m.s2 > m.s1) {
                        stats[m.t2].v += 1;
                        stats[m.t1].d += 1;
                    } else {
                        stats[m.t1].e += 1;
                        stats[m.t2].e += 1;
                    }
                });
                return stats;
            };

            const shareMatch = () => {
                const t1 = teams[currentMatchTeams[0]];
                const t2 = teams[currentMatchTeams[1]];
                if (!t1 || !t2) return;

                const text = `⚽ *Baba gostosinho - Resumo da Partida* ⚽\n\n` +
                    `Placar: ${t1.name} ${t1.score} x ${t2.score} ${t2.name}\n` +
                    `Tempo: ${formatTime(timerSeconds)}\n\n` +
                    `*${t1.name}:* ${t1.players.map(p => p.name).join(', ')}\n` +
                    `*${t2.name}:* ${t2.players.map(p => p.name).join(', ')}\n\n` +
                    `Organizado via Baba gostosinho!`;

                }

                                            <button

                                            >
                                                <Icon name="users" size={24} />
                                                <span className="text-xs tracking-widest">JOGADOR</span>

                                                                <div className="flex gap-0.5">
                                                                    {Array.from({ length: g.level }).map((_, i) => (
                                                                        <Icon key={i} name="star" size={8} fill="currentColor" className="text-amber-400" />
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            {confirmedPlayerIds.length === 0 && guests.length === 0 && (
                                                <div className="bg-zinc-50 p-8 rounded-2xl border border-dashed border-zinc-200 text-center">
                                                    <Icon name="users" size={32} className="mx-auto text-zinc-300 mb-2" />
                                                    <p className="text-xs text-zinc-400 font-medium">Nenhuma confirmação ainda.</p>
                                                </div>
                                            )}
                                        </section>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Match Tab */}
                        {currentTab === 'match' && (
                            <div className="space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-500">
                                {showDaySummary ? (
                                    <div className="space-y-6">
                                        <div className="text-center space-y-2">
                                            <h2 className="text-2xl font-black text-zinc-900 tracking-tighter">RESUMO DO DIA</h2>
                                            <p className="text-zinc-500 text-sm font-medium">Classificação e Elencos</p>
                                        </div>

                                        <div className="bg-white rounded-3xl border border-zinc-200 shadow-xl overflow-hidden">
                                            <table className="w-full text-sm">
                                                <thead className="bg-zinc-50 border-b border-zinc-200">
                                                    <tr>
                                                        <th className="px-4 py-3 text-left font-bold text-zinc-400 uppercase text-[10px]">Time</th>
                                                        <th className="px-2 py-3 text-center font-bold text-zinc-400 uppercase text-[10px]">V</th>
                                                        <th className="px-2 py-3 text-center font-bold text-zinc-400 uppercase text-[10px]">E</th>
                                                        <th className="px-2 py-3 text-center font-bold text-zinc-400 uppercase text-[10px]">D</th>
                                                        <th className="px-2 py-3 text-center font-bold text-zinc-400 uppercase text-[10px]">GP</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-zinc-100">
                                                    {Object.entries(calculateStats())
                                                        .sort((a, b) => {
                                                            if (b[1].v !== a[1].v) return b[1].v - a[1].v;
                                                            return b[1].gp - a[1].gp;
                                                        })
                                                        .map(([name, s], i) => (
                                                            <tr key={name} className={i === 0 ? "bg-amber-50/30" : ""}>
                                                                <td className="px-4 py-4 font-bold text-zinc-900 flex items-center gap-2">
                                                                    {i === 0 && <Icon name="trophy" size={14} className="text-amber-500" />}
                                                                    {name}
                                                                </td>
                                                                <td className="px-2 py-4 text-center font-medium text-zinc-600">{s.v}</td>
                                                                <td className="px-2 py-4 text-center font-medium text-zinc-600">{s.e}</td>
                                                                <td className="px-2 py-4 text-center font-medium text-zinc-600">{s.d}</td>
                                                                <td className="px-2 py-4 text-center font-bold text-zinc-900">{s.gp}</td>
                                                            </tr>
                                                        ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="grid grid-cols-1 gap-4">
                                            {teams.map((team, idx) => (
                                                <div key={idx} className="bg-zinc-50 p-4 rounded-2xl border border-zinc-200">
                                                    <h3 className="font-bold text-zinc-900 mb-2 flex items-center gap-2">
                                                        <div className="w-2 h-2 rounded-full bg-zinc-400"></div>
                                                        {team.name}
                                                    </h3>
                                                    <div className="flex flex-wrap gap-1">
                                                        {team.players.map((p, pIdx) => (
                                                            <span key={pIdx} className="text-[10px] bg-white px-2 py-1 rounded-md border border-zinc-200 text-zinc-600">
                                                                {p.name}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex flex-col gap-3">
                                            <button onClick={shareDaySummary} className="w-full bg-zinc-900 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                                                Compartilhar Resultado <Icon name="share-2" size={20} />
                                            </button>
                                            {isAdminMode && (
                                                <button onClick={resetDay} className="w-full bg-white text-zinc-700 font-bold py-3 rounded-2xl border border-zinc-200 flex items-center justify-center gap-2 text-sm hover:bg-zinc-50 transition-colors">
                                                    Iniciar Novo Baba <Icon name="refresh-cw" size={16} />
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                ) : (
                                    <>
                                        <div className="text-center space-y-2">
                                            <div className="inline-flex items-center gap-2 bg-zinc-100 px-4 py-2 rounded-full text-zinc-600 font-mono text-xl font-bold">
                                                <Icon name="play" size={20} /> <span>{formatTime(timerSeconds)}</span>
                                            </div>
                                            {isAdminMode && (
                                                <div className="flex justify-center gap-4 mt-4">
                                                    <button onClick={() => setIsTimerRunning(!isTimerRunning)} className={`w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg ${isTimerRunning ? 'bg-amber-500' : 'bg-emerald-600'}`}>
                                                        {isTimerRunning ? <Icon name="pause" size={24} /> : <Icon name="play" size={24} />}
                                                    </button>
                                                    <button onClick={() => { setIsTimerRunning(false); setTimerSeconds(0); }} className="w-14 h-14 rounded-full bg-zinc-200 text-zinc-600 flex items-center justify-center">
                                                        <Icon name="rotate-ccw" size={24} />
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col gap-4">
                                            {teams.length > 2 && (
                                                <div className="bg-white p-4 rounded-2xl border border-zinc-200 space-y-3">
                                                    <p className="text-[10px] font-bold text-zinc-400 uppercase text-center">Selecionar Times em Campo</p>
                                                    <div className="flex gap-2">
                                                        <select 
                                                            disabled={!isAdminMode}
                                                            value={currentMatchTeams[0]} 
                                                            onChange={(e) => {
                                                                const newMatch = [parseInt(e.target.value), currentMatchTeams[1]];
                                                                setCurrentMatchTeams(newMatch);
                                                                saveData(players, finances, { teams, currentMatchTeams: newMatch });
                                                            }}
                                                            className="flex-1 bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2 text-xs font-bold disabled:opacity-100"
                                                        >
                                                            {teams.map((t, i) => <option key={i} value={i}>{t.name}</option>)}
                                                        </select>
                                                        <div className="flex items-center text-zinc-300 font-bold">VS</div>
                                                        <select 
                                                            disabled={!isAdminMode}
                                                            value={currentMatchTeams[1]} 
                                                            onChange={(e) => {
                                                                const newMatch = [currentMatchTeams[0], parseInt(e.target.value)];
                                                                setCurrentMatchTeams(newMatch);
                                                                saveData(players, finances, { teams, currentMatchTeams: newMatch });
                                                            }}
                                                            className="flex-1 bg-zinc-50 border border-zinc-200 rounded-xl px-3 py-2 text-xs font-bold disabled:opacity-100"
                                                        >
                                                            {teams.map((t, i) => <option key={i} value={i}>{t.name}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                            )}
                                            <div className="flex items-center justify-between gap-4">
                                                {[currentMatchTeams[0], currentMatchTeams[1]].map((teamIdx, i) => {
                                                    const team = teams[teamIdx];
                                                    if (!team) return null;
                                                    return (
                                                        <div key={i} className="flex-1 bg-white p-6 rounded-3xl border text-center space-y-4">
                                                            <p className={`text-xs font-bold uppercase tracking-widest ${i === 0 ? 'text-emerald-600' : 'text-zinc-800'}`}>{team.name}</p>
                                                            <p className="text-6xl font-black">{team.score}</p>
                                                            {isAdminMode && (
                                                                <div className="flex justify-center gap-2">
                                                                    <button onClick={() => updateScore(teamIdx, -1)} className="p-2 bg-zinc-100 rounded-xl"><Icon name="minus" size={20} /></button>
                                                                    <button onClick={() => updateScore(teamIdx, 1)} className="p-2 bg-emerald-100 text-emerald-600 rounded-xl"><Icon name="plus" size={20} /></button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                        
                                        {isAdminMode && (
                                            <div className="space-y-3">
                                                <button onClick={endMatch} className="w-full bg-zinc-900 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                                                    Encerrar Partida <Icon name="check-circle" size={20} />
                                                </button>
                                                {matchHistory.length > 0 && (
                                                    <button onClick={endDay} className="w-full bg-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2">
                                                        Encerrar Baba do Dia <Icon name="trophy" size={20} />
                                                    </button>
                                                )}
                                            </div>
                                        )}

                                        {matchHistory.length > 0 && (
                                            <div className="space-y-4 pt-4">
                                                <h3 className="text-xs font-bold text-zinc-400 uppercase tracking-widest text-center">Histórico de Partidas</h3>
                                                <div className="space-y-2">
                                                    {matchHistory.slice().reverse().map((m, i) => (
                                                        <div key={i} className="bg-white p-3 rounded-xl border border-zinc-200 flex items-center justify-between text-xs">
                                                            <div className="flex-1 text-right font-bold text-zinc-600">{m.t1}</div>
                                                            <div className="mx-3 px-2 py-1 bg-zinc-100 rounded-lg font-black text-zinc-900">
                                                                {m.s1} x {m.s2}
                                                            </div>
                                                            <div className="flex-1 text-left font-bold text-zinc-600">{m.t2}</div>
                                                            <div className="ml-3 text-[10px] text-zinc-400 font-medium">{m.time}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        )}

                        {/* Finance Tab (Player View) */}
                        {currentTab === 'finance' && (
                            <div className="space-y-6">
                                <h2 className="text-2xl font-black">Financeiro</h2>
                                <div className="bg-emerald-600 p-6 rounded-3xl text-white shadow-lg">
                                    <p className="text-xs font-bold uppercase opacity-80">Saldo em Caixa</p>
                                    <p className="text-4xl font-black">R$ {totalBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                </div>
                                <div className="space-y-2">
                                    {finances.slice().reverse().map(f => (
                                        <div key={f.id} className="bg-white p-4 rounded-xl border flex items-center justify-between">
                                            <div>
                                                <p className="font-bold text-zinc-800 flex items-center">{f.description}{getAuthorTag(f.author)}</p>
                                                <p className="text-[10px] text-zinc-400 uppercase font-bold">{f.date}</p>
                                            </div>
                                            <span className={`font-black ${f.type === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                                                {f.type === 'income' ? '+' : '-'} R$ {f.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    {(currentTab !== 'home' || isAdminMode) && (
                        <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-zinc-200 px-4 py-3 z-10">
                            <div className="max-w-md mx-auto flex justify-around items-center">
                                <button onClick={() => { if (isViewMode) setCurrentTab('finance'); else if (isAdminMode) { setCurrentTab('home'); setAdminSubTab('finance'); } }} className={`flex flex-col items-center gap-1 ${((isAdminMode && currentTab === 'home' && adminSubTab === 'finance') || (isViewMode && currentTab === 'finance')) ? 'text-emerald-600' : 'text-zinc-400'}`}>
                                    <Icon name={isViewMode ? 'dollar-sign' : 'shield-check'} size={24} />
                                    <span className="text-[10px] font-bold uppercase">{isViewMode ? 'Financeiro' : 'Comissão'}</span>
                                </button>
                                <button onClick={() => setCurrentTab('teams')} className={`flex flex-col items-center gap-1 ${currentTab === 'teams' ? 'text-emerald-600' : 'text-zinc-400'}`}>
                                    <Icon name="shuffle" size={24} />
                                    <span className="text-[10px] font-bold uppercase">Times</span>
                                </button>
                                <button onClick={() => setCurrentTab('match')} className={`flex flex-col items-center gap-1 ${currentTab === 'match' ? 'text-emerald-600' : 'text-zinc-400'}`}>
                                    <Icon name="trophy" size={24} />
                                    <span className="text-[10px] font-bold uppercase">Partida</span>
                                </button>
                            </div>
                        </nav>
                    )}

                    {/* Password Modal */}
                    {showPasswordModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center p-6">
                            <div className="bg-white w-full max-w-xs rounded-3xl p-8 shadow-2xl space-y-6">
                                <div className="text-center space-y-2">
                                    <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                                        <Icon name="lock" size={32} />
                                    </div>
                                    <h3 className="text-xl font-black">Acesso Restrito</h3>
                                    <p className="text-sm text-zinc-500">Digite a senha da Comissão</p>
                                </div>
                                <div className="space-y-4">
                                    <input type="password" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdminAuth()} placeholder="••••••••" className="w-full px-4 py-4 rounded-2xl border-2 text-center text-2xl tracking-widest font-mono" />
                                    <div className="flex gap-3">
                                        <button onClick={() => setShowPasswordModal(false)} className="flex-1 py-4 font-bold text-zinc-400">Cancelar</button>
                                        <button onClick={handleAdminAuth} className="flex-1 bg-emerald-600 text-white py-4 rounded-2xl font-bold">Entrar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

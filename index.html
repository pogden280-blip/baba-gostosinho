<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baba Gostosinho</title>
    <!-- Tailwind CSS 3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- html2canvas -->
    <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .star-rating button { transition: transform 0.1s; }
        .star-rating button:active { transform: scale(0.9); }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f4f4f5;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a1a1aa;
        }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const motion = (window.Motion && window.Motion.motion) || (window.framerMotion && window.framerMotion.motion) || { div: 'div' };

        // Verificação de dependências
        if (!window.lucide || !window.React || !window.ReactDOM) {
            console.error("Erro: Algumas dependências (Lucide, React ou ReactDOM) não foram carregadas corretamente.");
        }

        // Configurações do JSONbin
        const BIN_ID = '69af06d2ae596e708f71a0ef';
        const MASTER_KEY = '$2a$10$RxtN.VwYLRsGcmoCji08oeL2di9W0D4tyrBZe/vIV77N665ALQ9Vi';
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // Componente de Ícone Lucide (Wrapper para CDN)
        const Icon = ({ name, size = 24, className = "", fill = "none" }) => {
            const containerRef = useRef(null);
            
            useEffect(() => {
                if (containerRef.current) {
                    // Clear container and create a fresh i element for Lucide to replace
                    containerRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    
                    if (window.lucide) {
                        window.lucide.createIcons({
                            attrs: {
                                size,
                                class: className,
                                fill
                            },
                            nameAttr: 'data-lucide'
                        });
                    }
                }
            }, [name, size, className, fill]);

            return <span ref={containerRef} className={`inline-flex items-center justify-center ${className}`}></span>;
        };

        // Helper to get position tag based on level/stars
        const getPositionTag = (level) => {
            switch (level) {
                case 1: return 'ATA';
                case 2: return 'MC';
                case 3: return 'LT';
                case 4: return 'VOL';
                case 5: return 'ZC';
                default: return '';
            }
        };

        function App() {
            const [players, setPlayers] = useState([]);
            const [finances, setFinances] = useState([]);
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('futamigos_current_user'));
            const [currentTab, setCurrentTab] = useState('home');
            const [adminSubTab, setAdminSubTab] = useState('finance');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [isViewMode, setIsViewMode] = useState(false);
            const [showPasswordModal, setShowPasswordModal] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [isLoading, setIsLoading] = useState(true);
            const [hasLoadedSuccessfully, setHasLoadedSuccessfully] = useState(false);
            const [isRecovering, setIsRecovering] = useState(false);
            const dataLoadedRef = useRef(false);
            
            const [showAddPlayerForm, setShowAddPlayerForm] = useState(false);
            const [showAddGuestForm, setShowAddGuestForm] = useState(false);
            const [guests, setGuests] = useState([]);
            const [confirmedPlayerIds, setConfirmedPlayerIds] = useState([]);
            const [absentCommissionIds, setAbsentCommissionIds] = useState([]);
            const [newGuestName, setNewGuestName] = useState('');
            const [newGuestRating, setNewGuestRating] = useState(3);
            const [isGuestGoalkeeper, setIsGuestGoalkeeper] = useState(false);
            const [isGuestPaid, setIsGuestPaid] = useState(true);
            
            // Form States
            const [newPlayerName, setNewPlayerName] = useState('');
            const [newPlayerRating, setNewPlayerRating] = useState(3);
            const [newPlayerType, setNewPlayerType] = useState('diarista');
            const [newPlayerPaymentStatus, setNewPlayerPaymentStatus] = useState('pago');
            const [newPlayerDueDate, setNewPlayerDueDate] = useState('');
            const [isGoalkeeper, setIsGoalkeeper] = useState(false);
            const [isPunished, setIsPunished] = useState(false);
            const [newPlayerPunishmentCount, setNewPlayerPunishmentCount] = useState(1);
            const [newPlayerPunishmentFine, setNewPlayerPunishmentFine] = useState(0);
            const [newPlayerPhotoUrl, setNewPlayerPhotoUrl] = useState('');
            const [isCommission, setIsCommission] = useState(false);
            const [financeDesc, setFinanceDesc] = useState('');
            const [financeAmount, setFinanceAmount] = useState('');
            const [financeType, setFinanceType] = useState('income');
            const [mensalidadeValue, setMensalidadeValue] = useState(26);
            const [diariaValue, setDiariaValue] = useState(8);
            const [isSavingSettings, setIsSavingSettings] = useState(false);
            const [filterStartDate, setFilterStartDate] = useState('');
            const [filterEndDate, setFilterEndDate] = useState('');
            
            // Role states
            const [showRoleModal, setShowRoleModal] = useState(false);
            const [selectedPlayerForRole, setSelectedPlayerForRole] = useState(null);
            const [newRolePassword, setNewRolePassword] = useState('');
            const [roleActionStep, setRoleActionStep] = useState('choice'); // 'choice', 'password', 'config'
            const [adminPasswordInput, setAdminPasswordInput] = useState('');
            const longPressTimer = useRef(null);

            const [accessHistory, setAccessHistory] = useState([]);
            const [showEditPlayerModal, setShowEditPlayerModal] = useState(false);
            const [editingPlayer, setEditingPlayer] = useState(null);
            const [careerSearch, setCareerSearch] = useState('');
            const [careerPlayer, setCareerPlayer] = useState(null);
            const [showCareerDashboard, setShowCareerDashboard] = useState(false);
            
            // Match States
            const [teams, setTeams] = useState([]); // Array of { name: 'Time 1', players: [], score: 0 }
            const [currentMatchTeams, setCurrentMatchTeams] = useState([0, 1]); // Indices of teams in match
            const [teamQueue, setTeamQueue] = useState([]); // Queue of team indices
            const [playersInDrawIds, setPlayersInDrawIds] = useState([]); // IDs of players who were in the draw
            const [currentLoans, setCurrentLoans] = useState([]); // Array of { fromTeamIdx, toTeamIdx, player }
            const [loanedPlayersIdsByTeam, setLoanedPlayersIdsByTeam] = useState({}); // { teamIdx: [playerIds] }
            const [matchHistory, setMatchHistory] = useState([]); // Array of { t1: name, s1: score, t2: name, s2: score, time: string }
            const [showDaySummary, setShowDaySummary] = useState(false);
            const [showAddTeamModal, setShowAddTeamModal] = useState(false);
            const [showAddPlayerToTeamModal, setShowAddPlayerToTeamModal] = useState(false);
            const [targetTeamIdx, setTargetTeamIdx] = useState(null);
            const [selectedPlayersForNewTeam, setSelectedPlayersForNewTeam] = useState([]);
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [drawNumTeams, setDrawNumTeams] = useState(2);
            const [drawPlayersPerTeam, setDrawPlayersPerTeam] = useState(6);
            const [drawIncludeGoalkeepers, setDrawIncludeGoalkeepers] = useState(true);
            const [drawMode, setDrawMode] = useState('teams');
            const timerRef = useRef(null);

            // Goal Tracking States
            const [showGoalModal, setShowGoalModal] = useState(false);
            const [goalTeamIdx, setGoalTeamIdx] = useState(null);
            const [goalStep, setGoalStep] = useState('scorer'); // 'scorer', 'assistant'
            const [currentScorer, setCurrentScorer] = useState(null);
            const [currentMatchGoals, setCurrentMatchGoals] = useState([]); // Array of { scorerId, scorerName, assistantId, assistantName }
            const [monthlyStats, setMonthlyStats] = useState({}); // { playerId: { name, goals, assists } }
            const [babaCount, setBabaCount] = useState(0); // 0 to 4
            const [highlights, setHighlights] = useState({
                artilheiro: { name: '', photo: '', stats: '', message: '' },
                garcom: { name: '', photo: '', stats: '', message: '' },
                goleiro: { name: '', photo: '', stats: '', message: '' },
                zagueiro: { name: '', photo: '', stats: '', message: '' },
                timeDaSemana: { name: '', photo: '', stats: '', message: '' }
            });
            const [showHighlightModal, setShowHighlightModal] = useState(null); // 'artilheiro', 'garcom', 'goleiro' or null
            const [tempHighlight, setTempHighlight] = useState({ name: '', stats: '', message: '' });
            const [isUploading, setIsUploading] = useState(false);
            const [showGoalkeeperModal, setShowGoalkeeperModal] = useState(null); // teamIndex or null

            const handleAddGoalkeeperToTeam = (teamIndex) => {
                setShowGoalkeeperModal(teamIndex);
            };

            const selectGoalkeeperForTeam = (player) => {
                const updatedTeams = teams.map((t, idx) => {
                    if (idx === showGoalkeeperModal) {
                        return { ...t, goalkeeper: player };
                    }
                    return t;
                });
                setTeams(updatedTeams);
                setShowGoalkeeperModal(null);
                saveData(players, finances, { teams: updatedTeams, currentMatchTeams, teamQueue });
            };

            const handleRemoveGoalkeeperFromTeam = (teamIndex) => {
                const updatedTeams = teams.map((t, idx) => {
                    if (idx === teamIndex) {
                        return { ...t, goalkeeper: null };
                    }
                    return t;
                });
                setTeams(updatedTeams);
                saveData(players, finances, { teams: updatedTeams, currentMatchTeams, teamQueue });
            };

            // Carregar dados do JSONbin
            useEffect(() => {
                const fetchData = async () => {
                    try {
                        const response = await fetch(API_URL, {
                            headers: { 'X-Master-Key': MASTER_KEY }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            const rawPlayers = data.record.players || [];
                            const rawFinances = data.record.finances || [];
                            const rawHistory = data.record.matchHistory || [];
                            const rawGuests = data.record.guests || [];
                            const rawConfirmed = data.record.confirmedPlayerIds || [];
                            const rawAbsent = data.record.absentCommissionIds || [];
                            const rawAccessHistory = data.record.accessHistory || [];
                            const rawMensalidade = data.record.mensalidadeValue || 26;
                            const rawDiaria = data.record.diariaValue || 8;
                            
                            // Check for expirations
                            const today = new Date();
                            today.setHours(0, 0, 0, 0);
                            let expirationsChanged = false;
                            const processedPlayers = rawPlayers.map(p => {
                                if (p.type === 'mensalista' && p.paymentStatus === 'pago' && p.dueDate && p.role !== 'commission') {
                                    const [year, month, day] = p.dueDate.split('-').map(Number);
                                    const dueDate = new Date(year, month - 1, day);
                                    if (dueDate < today) {
                                        expirationsChanged = true;
                                        return { ...p, paymentStatus: 'não', punishmentCount: p.punishmentCount || 0 };
                                    }
                                }
                                return { ...p, punishmentCount: p.punishmentCount || 0 };
                            });

                            setPlayers(processedPlayers);
                            setFinances(rawFinances);
                            setMatchHistory(rawHistory);
                            setGuests(rawGuests);
                            setAbsentCommissionIds(rawAbsent);
                            setAccessHistory(rawAccessHistory);
                            setMensalidadeValue(rawMensalidade);
                            setDiariaValue(rawDiaria);
                            setMonthlyStats(data.record.monthlyStats || {});
                            setBabaCount(data.record.babaCount || 0);
                            
                            const loadedHighlights = data.record.highlights || {};
                            const defaultHighlight = { name: '', photo: '', stats: '', message: '' };
                            const sanitizedHighlights = {
                                artilheiro: loadedHighlights.artilheiro || defaultHighlight,
                                garcom: loadedHighlights.garcom || defaultHighlight,
                                goleiro: loadedHighlights.goleiro || defaultHighlight,
                                zagueiro: loadedHighlights.zagueiro || defaultHighlight,
                                timeDaSemana: loadedHighlights.timeDaSemana || defaultHighlight
                            };
                            setHighlights(sanitizedHighlights);
                            
                            // Always filter confirmed list to only include paid players
                            let finalConfirmed = rawConfirmed.filter(id => {
                                const player = processedPlayers.find(p => p.id === id);
                                return player && player.paymentStatus === 'pago';
                            });

                            if (finalConfirmed.length === 0 && processedPlayers.length > 0 && !data.record.lastDraw) {
                                const defaultConfirmed = processedPlayers.filter(p => ((p.type === 'mensalista' && p.paymentStatus === 'pago') || p.role === 'commission') && !p.isPunished).map(p => p.id);
                                setConfirmedPlayerIds(defaultConfirmed);
                            } else {
                                setConfirmedPlayerIds(finalConfirmed);
                            }

                            setShowDaySummary(data.record.showDaySummary || false);

                                if (data.record.lastDraw) {
                                    if (data.record.lastDraw.teams) {
                                        setTeams(data.record.lastDraw.teams);
                                        if (data.record.lastDraw.currentMatchTeams) {
                                            setCurrentMatchTeams(data.record.lastDraw.currentMatchTeams);
                                        }
                                        if (data.record.lastDraw.teamQueue) {
                                            setTeamQueue(data.record.lastDraw.teamQueue);
                                        }
                                        if (data.record.lastDraw.playersInDrawIds) {
                                            setPlayersInDrawIds(data.record.lastDraw.playersInDrawIds);
                                        }
                                        if (data.record.lastDraw.currentLoans) {
                                            setCurrentLoans(data.record.lastDraw.currentLoans);
                                        }
                                        if (data.record.lastDraw.loanedPlayersIdsByTeam) {
                                            setLoanedPlayersIdsByTeam(data.record.lastDraw.loanedPlayersIdsByTeam);
                                        }
                                    } else if (data.record.lastDraw.teamA) {
                                        setTeams([
                                            { ...data.record.lastDraw.teamA, name: 'Time 1' },
                                            { ...data.record.lastDraw.teamB, name: 'Time 2' }
                                        ]);
                                    }
                                }

                                dataLoadedRef.current = true;
                                setHasLoadedSuccessfully(true);

                                if (expirationsChanged) {
                                    saveData(processedPlayers, rawFinances, data.record.lastDraw, rawHistory, data.record.showDaySummary, rawGuests, finalConfirmed, rawMensalidade, rawDiaria, rawAbsent);
                                }
                            } else {
                                console.error("Erro na resposta do servidor:", response.status);
                                alert("Erro ao conectar com o banco de dados. Os dados não foram carregados. Por favor, verifique sua conexão ou contate o suporte.");
                            }
                        } catch (error) {
                        console.error("Erro ao carregar dados:", error);
                        alert("Ocorreu um erro crítico ao carregar seus dados. Por segurança, o salvamento automático foi desativado nesta sessão.");
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchData();
            }, []);

            // Salvar dados no JSONbin
            const saveData = async (newPlayers, newFinances, lastDraw, newHistory, newShowSummary, newGuests, newConfirmedIds, newMensalidade, newDiaria, newAbsentIds, newAccessHistory, newCurrentLoans, newLoanHistory, newMonthlyStats, newBabaCount, newHighlights) => {
                if (!dataLoadedRef.current) {
                    console.warn("Tentativa de salvamento bloqueada: O banco de dados ainda não foi carregado.");
                    return;
                }
                try {
                    // Pruning logic to save space in JSONbin
                    const prunedFinances = (newFinances !== undefined ? newFinances : finances).slice(-200); // Keep last 200 financial records
                    const prunedAccessHistory = (newAccessHistory !== undefined ? newAccessHistory : accessHistory).slice(-50); // Keep last 50 access logs
                    
                    let currentDraw = null;
                    if (lastDraw !== undefined) {
                        if (lastDraw === null) {
                            currentDraw = null;
                        } else {
                            currentDraw = {
                                teams: lastDraw.teams !== undefined ? lastDraw.teams : teams,
                                currentMatchTeams: lastDraw.currentMatchTeams !== undefined ? lastDraw.currentMatchTeams : currentMatchTeams,
                                teamQueue: lastDraw.teamQueue !== undefined ? lastDraw.teamQueue : teamQueue,
                                playersInDrawIds: lastDraw.playersInDrawIds !== undefined ? lastDraw.playersInDrawIds : playersInDrawIds,
                                currentLoans: lastDraw.currentLoans !== undefined ? lastDraw.currentLoans : (newCurrentLoans || currentLoans),
                                loanedPlayersIdsByTeam: lastDraw.loanedPlayersIdsByTeam !== undefined ? lastDraw.loanedPlayersIdsByTeam : (newLoanHistory || loanedPlayersIdsByTeam)
                            };
                        }
                    } else if (teams.length > 0) {
                        currentDraw = { teams, currentMatchTeams, teamQueue, playersInDrawIds, currentLoans: newCurrentLoans || currentLoans, loanedPlayersIdsByTeam: newLoanHistory || loanedPlayersIdsByTeam };
                    }

                    const historyToSave = (newHistory !== undefined ? newHistory : matchHistory).slice(-50); // Keep last 50 matches (usually just one day)
                    const summaryToSave = newShowSummary !== undefined ? newShowSummary : showDaySummary;
                    const guestsToSave = newGuests !== undefined ? newGuests : guests;
                    const confirmedToSave = newConfirmedIds !== undefined ? newConfirmedIds : confirmedPlayerIds;
                    const mensalidadeToSave = newMensalidade !== undefined ? newMensalidade : mensalidadeValue;
                    const diariaToSave = newDiaria !== undefined ? newDiaria : diariaValue;
                    const absentToSave = newAbsentIds !== undefined ? newAbsentIds : absentCommissionIds;
                    const monthlyStatsToSave = newMonthlyStats !== undefined ? newMonthlyStats : monthlyStats;
                    const babaCountToSave = newBabaCount !== undefined ? newBabaCount : babaCount;
                    const highlightsToSave = newHighlights !== undefined ? newHighlights : highlights;
                    
                    const response = await fetch(API_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': MASTER_KEY
                        },
                        body: JSON.stringify({ 
                            players: newPlayers, 
                            finances: prunedFinances,
                            lastDraw: currentDraw,
                            matchHistory: historyToSave,
                            showDaySummary: summaryToSave,
                            guests: guestsToSave,
                            confirmedPlayerIds: confirmedToSave,
                            mensalidadeValue: mensalidadeToSave,
                            diariaValue: diariaToSave,
                            absentCommissionIds: absentToSave,
                            accessHistory: prunedAccessHistory,
                            monthlyStats: monthlyStatsToSave,
                            babaCount: babaCountToSave,
                            highlights: highlightsToSave
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.message || `Erro HTTP: ${response.status}`);
                    }
                } catch (error) {
                    console.error("Erro ao salvar dados:", error);
                    alert("Erro ao salvar dados: " + error.message);
                }
            };

            // Timer Logic
            useEffect(() => {
                if (isTimerRunning) {
                    timerRef.current = setInterval(() => {
                        setTimerSeconds(s => s + 1);
                    }, 1000);
                } else {
                    if (timerRef.current) clearInterval(timerRef.current);
                }
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [isTimerRunning]);

            const uploadToCloudinary = async (file) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'xctfsuff');
                try {
                    const response = await fetch(`https://api.cloudinary.com/v1_1/douqnbfzz/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();
                    if (data.secure_url) {
                        return data.secure_url;
                    } else {
                        throw new Error(data.error?.message || 'Erro no upload');
                    }
                } catch (error) {
                    console.error('Erro Cloudinary:', error);
                    alert('Erro ao subir imagem: ' + error.message);
                    return null;
                }
            };

            const handlePlayerPhotoUpload = async (e, player, isEditing = false) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsUploading(true);
                const url = await uploadToCloudinary(file);
                setIsUploading(false);
                
                if (url) {
                    if (isEditing) {
                        setEditingPlayer({ ...editingPlayer, photoUrl: url });
                    } else if (player) {
                        const updatedPlayers = players.map(p => p.id === player.id ? { ...p, photoUrl: url } : p);
                        setPlayers(updatedPlayers);
                        saveData(updatedPlayers, finances, undefined, matchHistory);
                    } else {
                        setNewPlayerPhotoUrl(url);
                    }
                }
            };

            const handleCareerSearch = () => {
                if (!careerSearch.trim()) return;
                const searchLower = careerSearch.toLowerCase().trim();
                const player = players.find(p => 
                    p.name.toLowerCase() === searchLower || 
                    p.name.toLowerCase().includes(searchLower)
                );
                
                if (player) {
                    setCareerPlayer(player);
                    setShowCareerDashboard(true);
                } else {
                    alert('Jogador não encontrado! Verifique se o nome está correto.');
                }
            };

            useEffect(() => {
                if (showHighlightModal) {
                    setTempHighlight({
                        name: highlights[showHighlightModal].name,
                        stats: highlights[showHighlightModal].stats,
                        message: highlights[showHighlightModal].message
                    });
                }
            }, [showHighlightModal]);

            const handleHighlightPhotoUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                setIsUploading(true);
                const url = await uploadToCloudinary(file);
                setIsUploading(false);
                
                if (url) {
                    const newHighlights = {
                        ...highlights,
                        [showHighlightModal]: {
                            ...highlights[showHighlightModal],
                            photo: url
                        }
                    };
                    setHighlights(newHighlights);
                    saveData(players, finances, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, newHighlights);
                }
            };

            const saveHighlightData = () => {
                const newHighlights = {
                    ...highlights,
                    [showHighlightModal]: {
                        ...highlights[showHighlightModal],
                        ...tempHighlight
                    }
                };
                setHighlights(newHighlights);
                saveData(players, finances, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, newHighlights);
                setShowHighlightModal(null);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            };

            const handleAdminAuth = () => {
                const authorizedPasswords = ["Dan2620", "Davi2168"];
                
                // Check dynamic commission members
                const commissionMember = players.find(p => p.role === 'commission' && p.password === passwordInput);
                
                if (authorizedPasswords.includes(passwordInput) || commissionMember) {
                    const user = commissionMember ? commissionMember.name : passwordInput;
                    setCurrentUser(user);
                    localStorage.setItem('futamigos_current_user', user);
                    
                    // Update access history
                    const newAccess = {
                        user: user,
                        time: new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
                    };
                    const updatedHistory = [newAccess, ...accessHistory].slice(0, 3);
                    setAccessHistory(updatedHistory);
                    
                    setIsAdminMode(true);
                    setIsViewMode(false);
                    setShowPasswordModal(false);
                    setCurrentTab('home');
                    setPasswordInput('');
                    
                    // Save with new history
                    saveData(players, finances, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, updatedHistory);
                } else {
                    alert("Senha incorreta! Acesso negado.");
                }
            };

            const handleLongPressStart = (player) => {
                longPressTimer.current = setTimeout(() => {
                    setSelectedPlayerForRole(player);
                    setRoleActionStep('choice');
                    setShowRoleModal(true);
                }, 800); // 800ms for long press
            };

            const handleLongPressEnd = () => {
                if (longPressTimer.current) {
                    clearTimeout(longPressTimer.current);
                }
            };

            const isPlayerConfirmed = (player) => {
                if (!player || player.isPunished) return false;
                if (player.role === 'commission') {
                    return !absentCommissionIds.includes(player.id);
                }
                return confirmedPlayerIds.includes(player.id);
            };

            const toggleCommissionAbsence = (player) => {
                const isCurrentlyAbsent = absentCommissionIds.includes(player.id);

                let numTeams = drawNumTeams;
                if (drawMode === 'players') {
                    numTeams = Math.max(2, Math.ceil(sortedFieldPlayers.length / drawPlayersPerTeam));
                }

                const targetSizes = Array(numTeams).fill(0);
                let remainingField = sortedFieldPlayers.length;
                if (drawMode === 'players') {
                    for (let i = 0; i < numTeams; i++) {
                        const size = Math.min(remainingField, drawPlayersPerTeam);
                        targetSizes[i] = size;
                        remainingField -= size;
                    }
                } else {
                    const fullSize = Math.ceil(sortedFieldPlayers.length / numTeams);
                    let remaining = sortedFieldPlayers.length;
                    for (let i = 0; i < numTeams - 1; i++) {
                        const size = Math.min(remaining, fullSize);
                        targetSizes[i] = size;
                        remaining -= size;

                        currentTeamIdx += direction;
                        if (currentTeamIdx >= numTeams || currentTeamIdx < 0) {
                            direction *= -1;
                            currentTeamIdx = direction === 1 ? 0 : numTeams - 1;

                setTimerSeconds(0);
                setIsTimerRunning(false);

                // Lógica de Partida: Quem ganha fica, quem perde sai
                let newQueue = teamQueue.length > 0 ? [...teamQueue] : Array.from({ length: teams.length }, (_, i) => i);
                let newMatchTeams = [...currentMatchTeams];

                if (t1.score > t2.score) {
                    // Time 1 ganhou, Time 2 sai
                    newQueue = newQueue.filter(idx => idx !== t2Idx);
                    newQueue.push(t2Idx);
                    const nextTeamIdx = newQueue.find(idx => idx !== t1Idx);
                    newMatchTeams = [t1Idx, nextTeamIdx];
                } else if (t2.score > t1.score) {
                    // Time 2 ganhou, Time 1 sai
                    newQueue = newQueue.filter(idx => idx !== t1Idx);
                    newQueue.push(t1Idx);
                    const nextTeamIdx = newQueue.find(idx => idx !== t2Idx);
                    newMatchTeams = [t2Idx, nextTeamIdx];
                } else {
                    // Empate
                    if (teams.length >= 4) {
                        // Saem os dois
                        newQueue = newQueue.filter(idx => idx !== t1Idx && idx !== t2Idx);
                        newQueue.push(t1Idx, t2Idx);
                        newMatchTeams = [newQueue[0], newQueue[1]];
                    } else if (teams.length === 3) {
                        // 3 times, empate: pede para definir novo confronto
                        alert('Empate com 3 times! Defina o próximo confronto manualmente.');
                    }
                }

                setTeamQueue(newQueue);
                setCurrentMatchTeams(newMatchTeams);
                setCurrentLoans([]); // Clear loans when match ends
                saveData(players, finances, { teams: updatedTeams, currentMatchTeams: newMatchTeams, teamQueue: newQueue, currentLoans: [], loanedPlayersIdsByTeam }, updatedHistory);
            };

            const handleAutoSubstitution = (targetTeamIdx) => {
                if (teams.length < 3) {
                    alert('Substituição automática requer pelo menos 3 times.');
                    return;
                }

                // O time que empresta é o último da fila
                const sourceTeamIdx = teamQueue[teamQueue.length - 1];
                const sourceTeam = teams[sourceTeamIdx];
                
                if (!sourceTeam) return;

                // Jogadores do time de origem que ainda não foram emprestados neste ciclo
                const alreadyLoanedIds = loanedPlayersIdsByTeam[sourceTeamIdx] || [];
                let availablePlayers = sourceTeam.players.filter(p => !alreadyLoanedIds.includes(p.id));
                let baseLoanedIds = alreadyLoanedIds;

                // Se todos já foram emprestados, reinicia o ciclo para este time
                if (availablePlayers.length === 0) {
                    availablePlayers = [...sourceTeam.players];
                    baseLoanedIds = [];
                }

                // Seleciona um jogador (o primeiro disponível)
                const playerToLoan = availablePlayers[0];
                if (!playerToLoan) return;

                // Atualiza empréstimos atuais e histórico de empréstimos
                const newLoans = [...currentLoans, { fromTeamIdx: sourceTeamIdx, toTeamIdx: targetTeamIdx, player: playerToLoan }];
                const newLoanHistory = { ...loanedPlayersIdsByTeam, [sourceTeamIdx]: [...baseLoanedIds, playerToLoan.id] };
                
                setCurrentLoans(newLoans);
                setLoanedPlayersIdsByTeam(newLoanHistory);

                saveData(players, finances, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, undefined, newLoans, newLoanHistory);

                alert(`JOGADOR EMPRESTADO: ${playerToLoan.name}\n(Do ${sourceTeam.name} para o ${teams[targetTeamIdx].name})`);
            };

            const endDay = () => {
                if (matchHistory.length === 0) {
                    alert('Nenhuma partida registrada hoje!');
                    return;
                }

                const { playerStats } = calculateStats();
                const newMonthlyStats = { ...monthlyStats };
                
                Object.entries(playerStats).forEach(([id, stats]) => {
                    if (id === 'anonymous') return;
                    if (stats.goals > 0 || stats.assists > 0 || stats.gamesAsGK > 0 || stats.defensePoints > 0) {
                        if (!newMonthlyStats[id]) {
                            newMonthlyStats[id] = { 
                                name: stats.name, 
                                goals: 0, 
                                assists: 0, 
                                goalsConceded: 0, 
                                isGoalkeeper: stats.isGoalkeeper,
                                defensePoints: 0,
                                monthlyMatchesPlayed: 0,
                                presences: 0,
                                totalBabas: 0,
                                level: stats.level || 3
                            };
                        }
                        newMonthlyStats[id].goals += stats.goals;
                        newMonthlyStats[id].assists += stats.assists;
                        newMonthlyStats[id].goalsConceded = (newMonthlyStats[id].goalsConceded || 0) + (stats.goalsConceded || 0);
                        newMonthlyStats[id].defensePoints = (newMonthlyStats[id].defensePoints || 0) + (stats.defensePoints || 0);
                        newMonthlyStats[id].monthlyMatchesPlayed = (newMonthlyStats[id].monthlyMatchesPlayed || 0) + (stats.monthlyMatchesPlayed || 0);
                        newMonthlyStats[id].isGoalkeeper = stats.isGoalkeeper;
                        
                        // Encontrar jogador real para atualizar frequência e nível
                        const realPlayer = players.find(p => p.id === id);
                        if (realPlayer) {
                            newMonthlyStats[id].presences = (realPlayer.presences || 0) + (isPlayerConfirmed(realPlayer) ? 1 : 0);
                            newMonthlyStats[id].totalBabas = (realPlayer.totalBabas || 0) + 1;
                            newMonthlyStats[id].level = realPlayer.level || 3;
                        }
                    }
                });

                const newBabaCount = babaCount + 1;
                setMonthlyStats(newMonthlyStats);
                setBabaCount(newBabaCount);
                
                // Lançar receitas dos diaristas pagos e convidados
                const newFinances = [...finances];
                const paidDiaristas = players.filter(p => p.type === 'diarista' && p.paymentStatus === 'pago');
                
                // Diaristas
                // Incluir quem pagou OU quem estava no sorteio (mesmo que ausente agora)
                const diaristasToCharge = players.filter(p => 
                    p.type === 'diarista' && 
                    p.role !== 'commission' &&
                    (p.paymentStatus === 'pago' || playersInDrawIds.includes(p.id))
                );
                
                diaristasToCharge.forEach((p, index) => {
                    newFinances.push({
                        id: `d-${Date.now()}-${p.id}-${index}`,
                        description: `Diária: ${p.name}${playersInDrawIds.includes(p.id) && !isPlayerConfirmed(p) ? ' (Ausente)' : ''}`,
                        amount: diariaValue,
                        type: 'income',
                        date: new Date().toLocaleDateString('pt-BR'),
                        author: currentUser
                    });
                });

                // Convidados (apenas os que pagaram)
                guests.filter(g => g.paymentStatus === 'pago').forEach((g, index) => {
                    newFinances.push({
                        id: `g-${Date.now()}-${g.id}-${index}`,
                        description: `Diária (Conv.): ${g.name}`,
                        amount: diariaValue,
                        type: 'income',
                        date: new Date().toLocaleDateString('pt-BR'),
                        author: currentUser
                    });
                });

                // Reset diaristas payment status and update frequency
                const updatedPlayers = players.map(p => {
                    const isConfirmed = isPlayerConfirmed(p);
                    let updated = { 
                        ...p, 
                        totalBabas: (p.totalBabas || 0) + 1,
                        presences: (p.presences || 0) + (isConfirmed ? 1 : 0)
                    };
                    
                    if (p.type === 'diarista' && p.role !== 'commission') {
                        updated.paymentStatus = 'devendo';
                    }
                    return updated;
                });
                
                setPlayers(updatedPlayers);
                setConfirmedPlayerIds([]); // Limpa confirmados ao encerrar o dia
                setFinances(newFinances);
                setGuests([]); // Limpa convidados ao encerrar o dia

                setShowDaySummary(true);
                saveData(updatedPlayers, newFinances, undefined, undefined, true, [], [], undefined, undefined, undefined, undefined, undefined, undefined, newMonthlyStats, newBabaCount);
            };

            const resetDay = () => {
                let nextMonthlyStats = monthlyStats;
                let nextBabaCount = babaCount;

                if (babaCount >= 4) {
                    if (confirm('O ciclo de 4 babas foi concluído. Deseja reiniciar o ranking mensal?')) {
                        nextMonthlyStats = {};
                        nextBabaCount = 0;
                        setMonthlyStats({});
                        setBabaCount(0);
                    }
                }

                setMatchHistory([]);
                setTeams([]);
                setGuests([]);
                setPlayersInDrawIds([]);
                setCurrentLoans([]);
                setLoanedPlayersIdsByTeam({});
                setShowDaySummary(false);
                
                const updatedPlayers = players.map(p => {
                    let updated = { ...p };
                    
                    // Decrementar punição
                    if (updated.isPunished && updated.punishmentCount > 0) {
                        updated.punishmentCount -= 1;
                        // Só libera se cumpriu os babas E pagou a multa
                        if (updated.punishmentCount === 0 && (updated.punishmentFinePaid !== false)) {
                            updated.isPunished = false;
                        }
                    } else if (updated.isPunished && updated.punishmentCount <= 0 && (updated.punishmentFinePaid !== false)) {
                        // Caso já tenha cumprido os babas mas pagou a multa agora
                        updated.isPunished = false;
                    }

                    if (updated.type === 'diarista' && updated.role !== 'commission') {
                        updated.paymentStatus = 'devendo';
                    }
                    return updated;
                });
                setPlayers(updatedPlayers);

                const defaultConfirmed = updatedPlayers.filter(p => ((p.type === 'mensalista' && p.paymentStatus === 'pago') || p.role === 'commission') && !p.isPunished).map(p => p.id);
                setConfirmedPlayerIds(defaultConfirmed);
                saveData(updatedPlayers, finances, null, [], false, [], defaultConfirmed, undefined, undefined, undefined, undefined, [], {}, nextMonthlyStats, nextBabaCount);
                setCurrentTab('home');
            };

            const shareDaySummary = () => {
                const { teamStats: stats, playerStats } = calculateStats();
                const sortedStats = Object.entries(stats).sort((a, b) => {
                    if (b[1].v !== a[1].v) return b[1].v - a[1].v;
                    return b[1].gp - a[1].gp;
                });

                const topScorers = Object.values(playerStats)
                    .filter(p => p.goals > 0)
                    .sort((a, b) => b.goals - a.goals)
                    .slice(0, 3);

                const topAssists = Object.values(playerStats)
                    .filter(p => p.assists > 0)
                    .sort((a, b) => b.assists - a.assists)
                    .slice(0, 3);

                let winnerText = "";
                if (sortedStats.length > 0) {
                    const topV = sortedStats[0][1].v;
                    const winners = sortedStats.filter(s => s[1].v === topV);
                    if (winners.length > 1) winnerText = `🏆 *Empate técnico:* ${winners.map(w => w[0]).join(' e ')}`;
                    else winnerText = `🏆 *Campeão:* ${winners[0][0]}`;
                }

                let text = `⚽ *RESUMO DO BABA GOSTOSINHO* ⚽\n\n${winnerText}\n\n`;
                
                text += `📊 *CLASSIFICAÇÃO:*\n`;
                sortedStats.forEach(([name, s]) => {
                    text += `${name}: ${s.v}V | ${s.e}E | ${s.d}D | ${s.gp} Gols\n`;
                });

                if (topScorers.length > 0) {
                    text += `\n🔥 *ARTILHARIA:*\n`;
                    topScorers.forEach(p => {
                        text += `${p.name}: ${p.goals} Gols\n`;
                    });
                }

                if (topAssists.length > 0) {
                    text += `\n🎯 *ASSISTÊNCIAS:*\n`;
                    topAssists.forEach(p => {
                        text += `${p.name}: ${p.assists} Ast\n`;
                    });
                }

                text += `\n👥 *ELENCOS:*\n`;
                teams.forEach(t => {
                    text += `*${t.name}:* ${t.players.map(p => p.name).join(', ')}\n`;
                });

                text += `\n🔥 *Parabéns a todos!*`;

                if (navigator.share) {
                    navigator.share({ text });
                } else {
                    const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
                    window.open(url, '_blank');
                }
            };

            const calculateStats = () => {
                const stats = {};
                const playerStats = {};

                // Initialize player stats
                players.forEach(p => {
                    playerStats[p.id] = { 
                        name: p.name, 
                        goals: 0, 
                        assists: 0, 
                        goalsConceded: 0, 
                        isGoalkeeper: p.isGoalkeeper, 
                        gamesAsGK: 0, 
                        level: p.level || 3, 
                        defensePoints: 0,
                        monthlyMatchesPlayed: 0,
                        presences: p.presences || 0,
                        totalBabas: p.totalBabas || 0
                    };
                });
                guests.forEach(g => {
                    playerStats[g.id] = { 
                        name: g.name, 
                        goals: 0, 
                        assists: 0, 
                        goalsConceded: 0, 
                        isGoalkeeper: g.isGoalkeeper, 
                        gamesAsGK: 0, 
                        level: g.level || 3, 
                        defensePoints: 0,
                        monthlyMatchesPlayed: 0,
                        presences: g.presences || 1, // Guests are 1/1
                        totalBabas: g.totalBabas || 1
                    };
                });

                teams.forEach(t => {
                    stats[t.name] = { v: 0, e: 0, d: 0, gp: 0 };
                });

                const getDefensePoints = (goals) => {
                    if (goals === 0) return 10;
                    if (goals === 1) return 8;
                    if (goals === 2) return 6;
                    if (goals === 3) return 4;
                    return 2;
                };

                matchHistory.forEach(m => {
                    if (!stats[m.t1]) stats[m.t1] = { v: 0, e: 0, d: 0, gp: 0 };
                    if (!stats[m.t2]) stats[m.t2] = { v: 0, e: 0, d: 0, gp: 0 };

                    stats[m.t1].gp += m.s1;
                    stats[m.t2].gp += m.s2;

                    // Defense Points for 5-star players (ZC)
                    const t1DefPoints = getDefensePoints(m.s2);
                    const t2DefPoints = getDefensePoints(m.s1);

                    if (m.t1Players) {
                        m.t1Players.forEach(pid => {
                            if (playerStats[pid]) {
                                playerStats[pid].monthlyMatchesPlayed = (playerStats[pid].monthlyMatchesPlayed || 0) + 1;
                                if (playerStats[pid].level === 5) {
                                    playerStats[pid].defensePoints = (playerStats[pid].defensePoints || 0) + t1DefPoints;
                                }
                            }
                        });
                    }
                    if (m.t2Players) {
                        m.t2Players.forEach(pid => {
                            if (playerStats[pid]) {
                                playerStats[pid].monthlyMatchesPlayed = (playerStats[pid].monthlyMatchesPlayed || 0) + 1;
                                if (playerStats[pid].level === 5) {
                                    playerStats[pid].defensePoints = (playerStats[pid].defensePoints || 0) + t2DefPoints;
                                }
                            }
                        });
                    }

                    // Goleiros - Gols sofridos
                    if (m.g1) {
                        if (!playerStats[m.g1]) {
                            const pData = players.find(p => p.id === m.g1) || guests.find(g => g.id === m.g1);
                            playerStats[m.g1] = { 
                                name: m.g1Name, 
                                goals: 0, 
                                assists: 0, 
                                goalsConceded: 0, 
                                isGoalkeeper: pData ? pData.isGoalkeeper : true,
                                gamesAsGK: 0,
                                level: pData ? (pData.level || 3) : 3
                            };
                        }
                        if (playerStats[m.g1].isGoalkeeper) {
                            playerStats[m.g1].goalsConceded += m.s2;
                            playerStats[m.g1].gamesAsGK += 1;
                        }
                    }
                    if (m.g2) {
                        if (!playerStats[m.g2]) {
                            const pData = players.find(p => p.id === m.g2) || guests.find(g => g.id === m.g2);
                            playerStats[m.g2] = { 
                                name: m.g2Name, 
                                goals: 0, 
                                assists: 0, 
                                goalsConceded: 0, 
                                isGoalkeeper: pData ? pData.isGoalkeeper : true,
                                gamesAsGK: 0,
                                level: pData ? (pData.level || 3) : 3
                            };
                        }
                        if (playerStats[m.g2].isGoalkeeper) {
                            playerStats[m.g2].goalsConceded += m.s1;
                            playerStats[m.g2].gamesAsGK += 1;
                        }
                    }

                    if (m.s1 > m.s2) {
                        stats[m.t1].v += 1;
                        stats[m.t2].d += 1;
                    } else if (m.s2 > m.s1) {
                        stats[m.t2].v += 1;
                        stats[m.t1].d += 1;
                    } else {
                        stats[m.t1].e += 1;
                        stats[m.t2].e += 1;
                    }

                    // Process goals and assists
                    if (m.goals) {
                        m.goals.forEach(g => {
                            if (g.scorerId === 'anonymous') return;
                            if (playerStats[g.scorerId]) {
                                playerStats[g.scorerId].goals += 1;
                            } else {
                                playerStats[g.scorerId] = { name: g.scorerName, goals: 1, assists: 0 };
                            }

                            if (g.assistantId && playerStats[g.assistantId]) {
                                playerStats[g.assistantId].assists += 1;
                            } else if (g.assistantId) {
                                playerStats[g.assistantId] = { name: g.assistantName, goals: 0, assists: 1 };
                            }
                        });
                    }
                });
                return { teamStats: stats, playerStats };
            };

            const shareMatch = () => {
                const t1 = teams[currentMatchTeams[0]];
                const t2 = teams[currentMatchTeams[1]];
                if (!t1 || !t2) return;

                const text = `⚽ *Baba gostosinho - Resumo da Partida* ⚽\n\n` +
                    `Placar: ${t1.name} ${t1.score} x ${t2.score} ${t2.name}\n` +
                    `Tempo: ${formatTime(timerSeconds)}\n\n` +
                    `*${t1.name}:* ${t1.players.map(p => p.name).join(', ')}\n` +
                    `*${t2.name}:* ${t2.players.map(p => p.name).join(', ')}\n\n` +
                    `Organizado via Baba gostosinho!`;

                if (navigator.share) {
                    navigator.share({ text });
                } else {
                    navigator.clipboard.writeText(text);
                    alert('Resumo copiado para a área de transferência!');
                }
            };

            const captureAndShare = async (elementId, fileName, e) => {
                const element = document.getElementById(elementId);
                if (!element) return;
                
                const h2c = window.html2canvas || (typeof html2canvas !== 'undefined' ? html2canvas : null);
                if (!h2c) {
                    alert('O sistema de imagem ainda está carregando...');
                    return;
                }

                const btn = e?.currentTarget || e?.target;
                if (btn && btn.tagName === 'BUTTON') btn.disabled = true;

                try {
                    await new Promise(resolve => setTimeout(resolve, 200));

                    const canvas = await h2c(element, {
                        backgroundColor: elementId === 'ranking-mensal' ? '#18181b' : '#f8fafc',
                        scale: 2,
                        useCORS: true,
                        allowTaint: true,
                        scrollY: -window.scrollY,
                    });
                    
                    const dataUrl = canvas.toDataURL('image/png');
                    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

                    if (navigator.share) {
                        try {
                            const response = await fetch(dataUrl);
                            const blob = await response.blob();
                            const file = new File([blob], `${fileName}.png`, { type: 'image/png' });

                            // No iOS, compartilhar apenas o arquivo aumenta a chance de aparecer "Salvar Imagem"
                            const shareData = {
                                files: [file]
                            };

                            if (navigator.canShare && navigator.canShare(shareData)) {
                                await navigator.share(shareData);
                                if (btn && btn.tagName === 'BUTTON') btn.disabled = false;
                                return;
                            }
                        } catch (err) {
                            console.warn('Erro no compartilhamento nativo:', err);
                        }
                    }

                    // Fallback para iOS se o share falhar: Abrir em nova aba para "Salvar Imagem"
                    if (isIOS) {
                        const newTab = window.open();
                        if (newTab) {
                            newTab.document.write(`
                                <body style="margin:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; color:#fff; font-family:sans-serif;">
                                    <p style="margin-bottom:20px; font-weight:bold; text-align:center; padding:0 20px;">Pressione e segure na imagem abaixo e escolha "Salvar em Fotos" para enviar à Galeria.</p>
                                    <img src="${dataUrl}" style="max-width:100%; max-height:80vh; object-fit:contain;" />
                                    <button onclick="window.close()" style="margin-top:20px; background:#fff; color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:bold;">Voltar ao App</button>
                                </body>
                            `);
                        } else {
                            alert('Por favor, permita pop-ups para salvar a imagem na galeria.');
                        }
                    } else {
                        downloadImage(dataUrl, fileName);
                        alert('Imagem baixada! Agora você pode compartilhá-la no WhatsApp.');
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    alert('Erro ao gerar imagem. Tente tirar um print da tela.');
                } finally {
                    if (btn && btn.tagName === 'BUTTON') btn.disabled = false;
                }
            };

            const downloadImage = (dataUrl, fileName) => {
                const link = document.createElement('a');
                link.href = dataUrl;
                link.download = `${fileName}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const totalBalance = finances.reduce((acc, f) => {
                return f.type === 'income' ? acc + f.amount : acc - f.amount;
            }, 0);

            const getAuthorTag = (author) => {
                if (author === 'Dan2620') return <span className="ml-2 px-1.5 py-0.5 bg-black text-white text-[8px] font-black rounded uppercase">Dan</span>;
                if (author === 'Davi2168') return <span className="ml-2 px-1.5 py-0.5 bg-red-600 text-white text-[8px] font-black rounded uppercase">Davi</span>;
                return null;
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-zinc-50">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600"></div>
                    </div>
                );
            }

            return (
                <div className="bg-zinc-50 text-zinc-900 min-h-screen pb-24">
                    {/* Header */}
                    {(currentTab !== 'home' || isAdminMode) && (
                        <header className="bg-white border-b border-zinc-200 sticky top-0 z-10">
                            <div className="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                                <button 
                                    onClick={() => {
                                        if (isAdminMode && currentTab === 'home') setIsAdminMode(false);
                                        else if (isViewMode) {
                                            setIsViewMode(false);
                                            setCurrentTab('home');
                                        }
                                        else setCurrentTab('home');
                                    }} 
                                    className="p-2 hover:bg-zinc-100 rounded-full transition-colors text-zinc-600"
                                >
                                    <Icon name="chevron-left" size={20} />
                                </button>
                                <button onClick={shareMatch} className="p-2 hover:bg-zinc-100 rounded-full transition-colors text-zinc-600">
                                    <Icon name="share-2" size={20} />
                                </button>
                            </div>
                        </header>
                    )}

                    <main className="max-w-md mx-auto px-4 py-6">
                        {/* Home Tab */}
                        {currentTab === 'home' && (
                            <div className="space-y-6">
                                {!isAdminMode && !isViewMode ? (
                                    <div className="fixed inset-0 flex flex-col items-center justify-end px-8 pb-20 bg-cover bg-center" style={{ backgroundImage: "url('https://image2url.com/r2/default/images/1773069462364-21238cdb-2ba8-4949-b313-b74d3a6466ec.png')" }}>
                                        <div className="flex gap-4 w-full max-w-md">
                                            <button 
                                                onClick={() => setShowPasswordModal(true)} 
                                                className="flex-1 bg-emerald-600/80 backdrop-blur-md hover:bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-[0_6px_0_rgb(5,120,85)] transition-all active:shadow-none active:translate-y-[6px] flex flex-col items-center justify-center gap-2 border border-white/20"
                                            >
                                                <Icon name="shield-check" size={24} />
                                                <span className="text-xs tracking-widest">COMISSÃO</span>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    setIsViewMode(true);

                                    <div className="flex items-center justify-between">
                                        <h3 className="text-xl font-black text-zinc-900 uppercase tracking-tighter">Completar Time</h3>
                                        <button onClick={() => setShowAddPlayerToTeamModal(false)} className="text-zinc-400 hover:text-zinc-600">
                                            <Icon name="x" size={24} />
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="max-h-96 overflow-y-auto pr-2 custom-scrollbar">
                                            <p className="text-[10px] font-black text-zinc-400 uppercase tracking-widest mb-4">Membros Disponíveis</p>
                                            
                                            <div className="space-y-2">
                                                {/* Jogadores que não estavam no sorteio */}
                                                {[...players, ...guests]
                                                    .filter(p => !playersInDrawIds.includes(p.id) && !p.isPunished)
                                                    .map(p => (
                                                        <button 
                                                            key={p.id}
                                                            onClick={() => addPlayerToTeam(p.id, targetTeamIdx)}
                                                            className="w-full flex items-center justify-between p-4 bg-zinc-50 border border-zinc-100 rounded-2xl hover:bg-zinc-100 transition-colors"
                                                        >
                                                            <div className="text-left">
                                                                <span className="font-bold text-zinc-700 block">{p.name} {p.isGoalkeeper && <span className="text-[8px] bg-amber-100 text-amber-600 px-1 rounded ml-1">GK</span>}</span>
                                                                <span className="text-[10px] text-zinc-400 uppercase">{p.type === 'mensalista' ? 'Mensalista' : p.type === 'convidado' ? 'Convidado' : 'Diarista'}</span>
                                                            </div>
                                                            <Icon name="plus" size={16} className="text-emerald-500" />
                                                        </button>
                                                    ))
                                                }

                                                <button 
                                                    onClick={() => {
                                                        const guestName = prompt('Nome do novo convidado:');
                                                        if (guestName) {
                                                            const isPaid = confirm(`${guestName} já pagou a diária? (OK = Pago, Cancelar = Devendo)`);
                                                            const newGuest = {
                                                                id: `late-guest-${Date.now()}`,
                                                                name: guestName,
                                                                isGoalkeeper: false,
                                                                rating: 3,
                                                                type: 'convidado',
                                                                paymentStatus: isPaid ? 'pago' : 'devendo'
                                                            };
                                                            setGuests([...guests, newGuest]);
                                                            addPlayerToTeam(newGuest.id, targetTeamIdx);
                                                        }
                                                    }}
                                                    className="w-full flex items-center justify-center gap-2 p-4 border-2 border-dashed border-emerald-100 rounded-2xl text-emerald-600 hover:bg-emerald-50 transition-colors bg-emerald-50/20"
                                                >
                                                    <Icon name="user-plus" size={18} />
                                                    <span className="font-bold text-xs uppercase">Novo Convidado</span>
                                                </button>
                                            </div>
                                            
                                            {/* Mostrar aviso se ninguém disponível fora o botão de novo convidado */}
                                            {[...players, ...guests].filter(p => !playersInDrawIds.includes(p.id) && !p.isPunished).length === 0 && (
                                                <p className="text-xs text-zinc-400 text-center py-4">Todos os membros cadastrados já estão no sorteio.</p>
                                            )}
                                        </div>
                                    </div>

                                    <button 
                                        onClick={() => setShowAddPlayerToTeamModal(false)}
                                        className="w-full py-4 font-bold text-zinc-400"
                                    >
                                        Cancelar
                                    </button>
                                </div>
                            </motion.div>
                        </div>
                    )}

                    {/* Highlight Edit Modal */}
                    {showHighlightModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[150] flex items-center justify-center p-4">
                            <motion.div 
                                initial={{ scale: 0.9, opacity: 0 }}
                                animate={{ scale: 1, opacity: 1 }}
                                className="bg-white w-full max-w-sm rounded-[2.5rem] overflow-hidden shadow-2xl"
                            >
                                <div className="p-8 space-y-6">
                                    <div className="flex items-center justify-between">
                                        <h3 className="text-xl font-black text-zinc-900 uppercase tracking-tighter">Editar Destaque</h3>
                                        <button onClick={() => setShowHighlightModal(null)} className="text-zinc-400 hover:text-zinc-600">
                                            <Icon name="x" size={24} />
                                        </button>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">Foto do Craque</label>
                                            <div className="flex items-center gap-4">
                                                <div className="w-16 h-16 rounded-2xl bg-zinc-100 overflow-hidden border-2 border-zinc-50 flex-shrink-0">
                                                    {highlights[showHighlightModal].photo ? (
                                                        <img src={highlights[showHighlightModal].photo} className="w-full h-full object-cover" referrerPolicy="no-referrer" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-zinc-300">
                                                            <Icon name="user" size={24} />
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="flex-1">
                                                    <label className={`w-full py-3 rounded-xl border-2 border-dashed flex items-center justify-center gap-2 cursor-pointer transition-all ${isUploading ? 'bg-zinc-50 border-zinc-200 text-zinc-400' : 'bg-emerald-50 border-emerald-200 text-emerald-600 hover:bg-emerald-100'}`}>
                                                        <input type="file" className="hidden" accept="image/*" onChange={handleHighlightPhotoUpload} disabled={isUploading} />
                                                        {isUploading ? (
                                                            <>
                                                                <div className="w-4 h-4 border-2 border-zinc-300 border-t-zinc-500 rounded-full animate-spin"></div>
                                                                <span className="text-xs font-bold">Subindo...</span>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <Icon name="camera" size={18} />
                                                                <span className="text-xs font-bold">Trocar Foto</span>
                                                            </>
                                                        )}
                                                    </label>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">
                                                {showHighlightModal === 'timeDaSemana' ? 'Nome do Time' : 'Nome do Jogador'}
                                            </label>
                                            <input 
                                                type="text"
                                                value={tempHighlight.name}
                                                onChange={(e) => setTempHighlight({...tempHighlight, name: e.target.value})}
                                                placeholder={showHighlightModal === 'timeDaSemana' ? "Ex: Time do Baba" : "Ex: Neymar Jr"}
                                                className="w-full bg-zinc-50 border border-zinc-200 rounded-2xl py-4 px-5 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-bold"
                                            />
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">
                                                {showHighlightModal === 'timeDaSemana' ? 'Resultado/Stats' : 'Números (Stats)'}
                                            </label>
                                            <input 
                                                type="text"
                                                value={tempHighlight.stats}
                                                onChange={(e) => setTempHighlight({...tempHighlight, stats: e.target.value})}
                                                placeholder={showHighlightModal === 'timeDaSemana' ? "Ex: Campeão Invicto" : "Ex: 15 Gols no Mês"}
                                                className="w-full bg-zinc-50 border border-zinc-200 rounded-2xl py-4 px-5 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-bold"
                                            />
                                        </div>

                                        <div className="space-y-2">
                                            <label className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">
                                                {showHighlightModal === 'timeDaSemana' ? 'Descrição do Time' : 'Mensagem de Elogio'}
                                            </label>
                                            <textarea 
                                                value={tempHighlight.message}
                                                onChange={(e) => setTempHighlight({...tempHighlight, message: e.target.value})}
                                                placeholder={showHighlightModal === 'timeDaSemana' ? "Ex: Elenco que dominou o baba de sábado!" : "Ex: Parabéns pelo desempenho absurdo!"}
                                                rows="3"
                                                className="w-full bg-zinc-50 border border-zinc-200 rounded-2xl py-4 px-5 focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-medium text-sm"
                                            ></textarea>
                                        </div>
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button onClick={() => setShowHighlightModal(null)} className="flex-1 py-4 font-bold text-zinc-400">Cancelar</button>
                                        <button onClick={saveHighlightData} className="flex-1 bg-zinc-900 text-white py-4 rounded-2xl font-bold shadow-lg shadow-zinc-900/20">Salvar</button>
                                    </div>
                                </div>
                            </motion.div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
